<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TM30 Helper — worklist</title>
    <!--
      A-WEB-4b SCAFFOLDING — deliberately minimal.

      This window exists to PROVE the v2 deep-link wire: it opened, and here is the payload the
      Helper actually parsed. The real two-pane worklist UI (villa groups, the portal pane, the
      per-villa session keyed `villaSession[villaId]` per 014 §7.2 AMB-1) is A-WEB-4c–4f and is
      intentionally NOT built here. Expect this file to be replaced wholesale.

      The one thing it must show honestly is the distinction 014 §7.9 is about: a row with NO
      credentials is a REAL, EXPECTED state (creds start empty) and renders as "manual login",
      not as an error. A broken link never reaches this window at all — it gets a native error
      box from main.js.
    -->
    <style>
      body {
        font: 13px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 0;
        padding: 24px;
        color: #111;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      .sub {
        color: #666;
        margin-bottom: 16px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        text-align: left;
        padding: 6px 10px;
        border-bottom: 1px solid #eee;
        vertical-align: top;
      }
      th {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #666;
      }
      .dot-due {
        color: #1d4ed8;
        font-weight: 600;
      }
      .dot-overdue {
        color: #b91c1c;
        font-weight: 600;
      }
      .creds {
        color: #047857;
      }
      .manual {
        color: #92400e;
      }
      .empty {
        color: #666;
        padding: 24px 0;
      }
      code {
        font-size: 11px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>TM30 worklist — parsed from the deep link</h1>
    <div class="sub" id="summary"></div>
    <div id="content"></div>

    <script>
      function fromBase64Url(s) {
        return decodeURIComponent(
          atob(s.replace(/-/g, '+').replace(/_/g, '/'))
            .split('')
            .map(function (c) {
              return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            })
            .join('')
        );
      }

      var payload = { worklist: [] };
      try {
        var d = new URLSearchParams(location.search).get('d');
        if (d) payload = JSON.parse(fromBase64Url(d));
      } catch (e) {
        // main.js already validated + reported; this window only ever sees a good payload.
        console.error('[tm30-helper] worklist window could not read its payload', e);
      }

      var rows = payload.worklist || [];
      var withCreds = rows.filter(function (r) {
        return r.account;
      }).length;

      document.getElementById('summary').textContent =
        rows.length +
        ' filing(s) · ' +
        withCreds +
        ' with saved credentials · ' +
        (rows.length - withCreds) +
        ' need manual login';

      var content = document.getElementById('content');

      if (!rows.length) {
        content.innerHTML =
          '<div class="empty">Nothing to file right now. (An empty worklist is a valid link, not a broken one.)</div>';
      } else {
        var html =
          '<table><thead><tr><th>Filing</th><th>Villa</th><th>Check-in</th>' +
          '<th>Status</th><th>Dot</th><th>Credentials</th><th>Links</th></tr></thead><tbody>';

        rows.forEach(function (r) {
          var acct = r.account
            ? '<span class="creds">' + r.account.login + '</span>'
            : '<span class="manual">no credentials — log in by hand</span>';
          var links = [];
          if (r.sheet_download_url) links.push('sheet');
          if (r.folder_url) links.push('folder');
          if (r.return_url) links.push('return');

          html +=
            '<tr><td>#' +
            r.filing_id +
            '</td><td>' +
            r.villa +
            '</td><td>' +
            (r.checkin || '—') +
            '</td><td>' +
            (r.status || '—') +
            (r.report_status ? ' / ' + r.report_status : '') +
            '</td><td class="dot-' +
            (r.dot || '') +
            '">' +
            (r.dot || '—') +
            '</td><td>' +
            acct +
            '</td><td><code>' +
            (links.join(', ') || '—') +
            '</code></td></tr>';
        });

        content.innerHTML = html + '</tbody></table>';
      }
    </script>
  </body>
</html>
