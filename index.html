<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TM30 Helper</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #e1e4e8;
    --text: #1f2328;
    --muted: #656d76;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  main {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 40px;
    max-width: 440px;
    text-align: center;
  }
  h1 { margin: 0 0 12px; font-size: 20px; }
  p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--muted); }
  .version { margin-top: 20px; font-size: 12px; }
</style>
</head>
<body>

<main>
  <h1>TM30 Helper</h1>
  <p>This app is launched from the dashboard: press the TM30 button there to open your filing queue.</p>
  <p class="version">Version 2.0.0</p>
</main>

</body>
</html>
