<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TM30 Helper</title>
    <!--
      A-WEB-4c — THE TWO-PANE WINDOW SHELL (014 §2.4, §3; mockup H1).
      A-WEB-4d — the LEFT PANE's grouped worklist (014 §7.2; mockup H2 + H4). 4d replaced
                 `renderList()`, the single seam 4c left for it, and added the ⬇ download +
                 📁 folder actions through `preload.js`. Nothing else in the shell moved.
      A-WEB-4e — the RIGHT PANE's credential AUTOFILL, the captcha-wait status, and the
                 villa session that unlocks a group (014 §3, §7.9; 005 §8.1/§8.3; mockup H5 + H8).
                 4e is the ONLY code that calls `webview.executeJavaScript`, and it injects
                 exactly one thing: the login + password, into the fields, once the HUMAN has
                 cleared Turnstile. See the PORTAL NO-GO box in the 4e section below.

      One window, two panes. This replaces v1's two-window model FOR THE v2 PATH ONLY: the v1
      windows (`index.html` chooser, `window.html` per-account portal) are untouched and still
      open for v1 links (013 §3.5 — backward-compat is mandatory).

      ── What this file IS ───────────────────────────────────────────────────────────────────
      The CONTAINER, matched to the signed-off mockup: a 360px worklist pane on the left, the
      portal `<webview>` pane on the right, a urlbar above it and a status line below it.

      ── What this file deliberately is NOT ──────────────────────────────────────────────────
      · 4i — portal submit detection. Not accepted into iteration 1 (orchestrator 2026-07-17).
      · a recorder of `submitted`. 4f hands `return_url` to the browser and the WEB records it via
        endpoint #9 (005 §8.4). The Helper never learns the outcome — see `markSubmitted`.

      ── Constraints this file is built under ────────────────────────────────────────────────
      · ZERO Helper network calls (014 §2.5). Everything rendered comes out of the deep-link
        payload, which main.js already parsed and passed in as `?d=<base64url(JSON)>`. The
        `<webview>` navigating to the portal is the HUMAN's browser session, not a Helper fetch.
      · Portal NO-GO (010 §8). No DOM automation, no auto-submit, no captcha interaction.
      · NO credentials is the NORMAL state (creds start empty, PO 2026-07-20). The window must
        render fine without `account`, and the right pane still shows the portal for manual
        login. Nothing here is gated on `account` being present.
      · English only (4a′ PO ruling). No Russian strings.
      · A session belongs to the VILLA, not to the group box it is drawn in (014 §7.2 AMB-1) —
        hence `state.villaSession` is keyed by villa, and 4d must not re-key it per group.
    -->
    <style>
      /* Tokens lifted verbatim from the signed-off mockup so 4d/4e inherit the same palette. */
      :root {
        --paper: #edf0f3; --surface: #ffffff; --surface-2: #f6f8fa;
        --ink: #0f1519; --muted: #5a6673; --faint: #8794a2;
        --line: #d3dae2; --line-soft: #e2e7ed;
        --accent: #2a5d8f; --accent-soft: #e4edf6;
        --due: #8a5a0e; --due-bg: #fbefd9;
        --overdue: #9c2e26; --overdue-bg: #fbe3e0;
        --ok: #1e6047; --ok-bg: #ddf0e7;
        --blocked: #616d7a; --blocked-bg: #e7ebef;
        --ui: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #10151a; --surface: #171e26; --surface-2: #1c242e;
          --ink: #e4eaf0; --muted: #94a2b1; --faint: #6f7e8e;
          --line: #29323d; --line-soft: #222a34;
          --accent: #74a9dc; --accent-soft: #1b2a3a;
          --due: #d9a441; --due-bg: #33280f;
          --overdue: #e8776c; --overdue-bg: #3a1f1c;
          --ok: #5fb98c; --ok-bg: #12301f;
          --blocked: #8c9aa8; --blocked-bg: #232b34;
        }
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: var(--ui);
        font-size: 14px;
        color: var(--ink);
        background: var(--paper);
      }

      /* ── the two panes (mockup H1: grid 360px 1fr) ───────────────────────────────────── */
      .panes {
        display: grid;
        grid-template-columns: 360px 1fr;
        height: 100%;
      }
      .pane-l {
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        background: var(--surface);
        min-height: 0;
      }
      .pane-r {
        display: flex;
        flex-direction: column;
        background: var(--surface-2);
        min-width: 0;
        min-height: 0;
      }

      .pane-head {
        padding: 11px 14px;
        border-bottom: 1px solid var(--line-soft);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex: 0 0 auto;
      }
      .pane-head h3 { margin: 0; font-size: 13px; font-weight: 650; letter-spacing: 0.02em; }
      .pane-head .count { font-size: 11px; color: var(--faint); font-family: var(--mono); }

      .list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        min-height: 0;
      }

      /*
        🔴 `.list`, `.vg-body` and `.group-body` are all COLUMN FLEX containers, so their
        children default to `flex-shrink: 1` and get SQUASHED once the worklist is taller than
        the pane — rows lose their action bar and whole rows vanish behind the next group,
        instead of the list scrolling. Observed while building 4d with a 9-row fixture. Every
        list child is therefore pinned to its natural height; `.list`'s `overflow-y: auto` then
        does what it was always meant to.
      */
      .list > *,
      .vg-body > *,
      .group-body > * { flex: 0 0 auto; }

      /* ── worklist row (mockup H2 — row art lifted verbatim) ──────────────────────────── */
      .row {
        border: 1px solid var(--line);
        border-left: 3px solid var(--blocked);
        border-radius: 8px;
        padding: 10px 11px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: var(--surface);
        position: relative;
        cursor: pointer;
        transition: 0.15s;
        text-align: left;
        font: inherit;
        color: inherit;
      }
      .row:hover { box-shadow: 0 2px 8px -4px rgba(0, 0, 0, 0.25); }
      .row.sel {
        background: var(--accent-soft);
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .row.s-need { border-left-color: var(--due); }
      .row.s-dl { border-left-color: var(--accent); }
      .row.s-sub { border-left-color: var(--ok); }
      .row.s-over { border-left-color: var(--overdue); }
      .row.s-block { border-left-color: var(--blocked); opacity: 0.75; }
      .row.s-await { border-left-color: var(--ok); border-left-style: dashed; }

      .row-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
      .villa { font-size: 13.5px; font-weight: 640; letter-spacing: -0.01em; line-height: 1.3; }
      .when {
        font-size: 11.5px;
        color: var(--muted);
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        margin-top: 3px;
      }
      .when .due { color: var(--due); font-weight: 600; }
      .when .over { color: var(--overdue); font-weight: 700; }

      .badge {
        flex: none;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 3px 7px;
        border-radius: 5px;
        white-space: nowrap;
        background: var(--blocked-bg);
        color: var(--blocked);
      }
      .badge.b-need { background: var(--due-bg); color: var(--due); }
      .badge.b-dl { background: var(--accent-soft); color: var(--accent); }
      .badge.b-sub { background: var(--ok-bg); color: var(--ok); }
      .badge.b-over { background: var(--overdue-bg); color: var(--overdue); }
      .badge.b-block { background: var(--blocked-bg); color: var(--blocked); }
      .badge.b-await { background: transparent; color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }

      /*
        Row action bar — ONE fixed slot order for every state: status · xlsx · folder. Markup is
        authored in that order too, so tab order matches what you see; the `order` values are a
        guard, not the mechanism. Slots are always PRESENT: they disable, they never disappear,
        so nothing shifts position as a row changes state (mockup H2).
      */
      .acts { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; order: 2; }
      .act-status { order: 1; margin-right: auto; }
      .act-sheet { order: 2; }
      .act-folder { order: 3; }
      .btn {
        font: inherit;
        font-size: 11.5px;
        font-weight: 550;
        padding: 4px 9px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--ink);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        transition: 0.15s;
      }
      .btn:hover:not([disabled]) { border-color: var(--accent); color: var(--accent); }
      .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .btn.primary:hover:not([disabled]) { filter: brightness(1.08); color: #fff; }
      .btn.done { background: var(--ok-bg); border-color: transparent; color: var(--ok); cursor: default; }
      .rowmsg { font-size: 11px; color: var(--muted); font-style: italic; order: 1; }

      /* ── postponed (24h+) group + the "within 24h" divider (mockup H4) ───────────────── */
      .group { border: 1px dashed var(--line); border-radius: 8px; background: var(--surface-2); }
      .group-h {
        width: 100%;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        background: none;
        border: 0;
        cursor: pointer;
        padding: 9px 11px;
        display: flex;
        align-items: center;
        gap: 7px;
        text-align: left;
      }
      .group-h .chev { transition: transform 0.18s; display: inline-block; font-size: 9px; color: var(--faint); }
      .group.open .chev { transform: rotate(90deg); }
      .group-h .sub { color: var(--faint); font-weight: 500; }
      .group-body { padding: 0 8px 8px; display: flex; flex-direction: column; gap: 7px; }
      .divider {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 3px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .divider::after { content: ''; flex: 1; height: 1px; background: var(--line-soft); }

      /*
        ── villa group (mockup H4, 014 §7.2) ───────────────────────────────────────────────
        The villa — not the row — is the session unit. The header owns the login; the body owns
        the rows that login unlocks. The inset rail down the body is that ownership, DRAWN: it
        runs from the header through every row, so "one solve covers all of these" is visible.
      */
      .vgroup { border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); overflow: hidden; }
      .vgroup-h {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 11px;
        background: var(--surface);
        border-bottom: 1px solid var(--line-soft);
        border-left: 3px solid var(--due);
        cursor: pointer;
        width: 100%;
        font: inherit;
        color: inherit;
        text-align: left;
      }
      .vgroup.open-session .vgroup-h { border-left-color: var(--ok); }
      .vgroup.no-acct .vgroup-h { border-left-color: var(--blocked); }
      .vgroup.sel .vgroup-h { background: var(--accent-soft); }
      .vg-id { min-width: 0; flex: 1; }
      .vg-name { font-size: 13px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
      .vg-acct {
        font-size: 10.5px;
        font-family: var(--mono);
        color: var(--muted);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .vg-acct.none { font-family: var(--ui); font-style: italic; color: var(--faint); }
      .vg-pill {
        flex: none;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 3px 7px;
        border-radius: 5px;
        white-space: nowrap;
      }
      .vg-pill.locked { background: var(--due-bg); color: var(--due); }
      .vg-pill.open { background: var(--ok-bg); color: var(--ok); }
      .vg-pill.manual { background: var(--blocked-bg); color: var(--blocked); }
      .vg-body {
        padding: 7px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        box-shadow: inset 3px 0 0 var(--due);
      }
      .vgroup.open-session .vg-body { box-shadow: inset 3px 0 0 var(--ok); }
      .vgroup.no-acct .vg-body { box-shadow: inset 3px 0 0 var(--blocked); }
      .vgroup.finished .vg-body { box-shadow: inset 3px 0 0 var(--ok); }

      .st-ok { color: var(--ok); font-weight: 600; }

      .empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 34px 20px;
        text-align: center;
      }
      .empty .big { font-size: 13.5px; font-weight: 640; }
      .empty .sm { font-size: 11.5px; color: var(--muted); max-width: 30ch; line-height: 1.5; }

      /* ── right pane: urlbar · webview · status line ───────────────────────────────────── */
      .urlbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 11px;
        background: var(--surface);
        border-bottom: 1px solid var(--line-soft);
        flex: 0 0 auto;
      }
      .urlbar button {
        border: none;
        background: transparent;
        color: var(--faint);
        font-size: 14px;
        cursor: pointer;
        width: 24px;
        height: 24px;
        border-radius: 5px;
      }
      .urlbar button:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
      .urlbar button:disabled { opacity: 0.35; cursor: default; }
      .urlbox {
        flex: 1;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        background: var(--surface-2);
        border: 1px solid var(--line-soft);
        border-radius: 5px;
        padding: 4px 9px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .viewport { flex: 1; position: relative; min-height: 0; }
      webview { position: absolute; inset: 0; width: 100%; height: 100%; display: flex; }
      .portal-msg {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 22px;
        text-align: center;
        background: var(--surface-2);
        color: var(--muted);
        font-size: 12px;
        z-index: 2;
      }
      .portal-msg .icon { font-size: 30px; }
      .portal-msg .hint { font-size: 11px; color: var(--faint); max-width: 46ch; line-height: 1.5; }
      .hidden { display: none !important; }
      .loading-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 3px;
        width: 0%;
        background: var(--accent);
        transition: width 0.4s ease;
        z-index: 3;
      }

      .statusline {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 13px;
        border-top: 1px solid var(--line);
        background: var(--surface-2);
        font-size: 11.5px;
        color: var(--muted);
        flex-wrap: wrap;
        flex: 0 0 auto;
      }
      .statusline .sep { color: var(--line); user-select: none; }
      .statusline .spacer { flex: 1; }
      .st-acct { font-weight: 600; color: var(--ink); }
      .st-none { color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="panes">
      <!-- LEFT — the worklist container. 4d fills this with villa groups. -->
      <section class="pane-l" aria-label="Worklist">
        <div class="pane-head">
          <h3>to do</h3>
          <span class="count" id="count">—</span>
        </div>
        <div class="list" id="list"></div>
      </section>

      <!-- RIGHT — the portal pane. Real webview; the human drives it. -->
      <section class="pane-r" aria-label="TM30 portal">
        <div class="urlbar">
          <button id="btn-back" title="Back" disabled>‹</button>
          <button id="btn-fwd" title="Forward" disabled>›</button>
          <button id="btn-reload" title="Reload" disabled>⟳</button>
          <span class="urlbox" id="urlbox"></span>
        </div>
        <div class="viewport">
          <div class="loading-bar" id="loading-bar"></div>
          <!--
            The portal URL lives HERE, as the attribute, and is the single source of truth (the
            script reads it back out). Assigning `webview.src` from script races the element's
            attachment and the navigation is silently dropped — the webview just sits on
            about:blank with no did-fail-load to tell you. Verified while building 4c.
          -->
          <webview id="portal" src="https://tm30.immigration.go.th" allowpopups></webview>
          <div class="portal-msg" id="portal-msg">
            <div class="icon">◌</div>
            <div>Loading the portal…</div>
          </div>
        </div>
        <div class="statusline" id="statusline"></div>
      </section>
    </div>

    <script>
      'use strict';

      var TM30_URL = document.getElementById('portal').getAttribute('src');

      // ── payload ────────────────────────────────────────────────────────────────────────
      // Same zero-dep mechanism v1 uses: main.js base64url-encodes the ALREADY-PARSED payload
      // into the file query. No preload, no IPC, no fetch. main.js has already validated it and
      // shown a native error box for anything broken, so this window only ever sees a good one.
      function readPayload() {
        var d = new URLSearchParams(location.search).get('d');
        if (!d) return { v: 2, worklist: [] };
        try {
          var b64 = d.replace(/-/g, '+').replace(/_/g, '/');
          var bytes = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
          return JSON.parse(new TextDecoder().decode(bytes));
        } catch (e) {
          console.error('[tm30-helper] app.html could not read its payload', e);
          return { v: 2, worklist: [] };
        }
      }

      /**
       * The shell's whole state. Deliberately small.
       *
       * `villaSession` is keyed by VILLA and never by group box — 014 §7.2 AMB-1: a villa that
       * straddles the 24h boundary is drawn in two buckets but is ONE session, and keying it per
       * box would cost two Turnstile solves and defeat the reason grouping exists. 4c only stands
       * the map up; 4e writes to it when a login lands.
       *
       * 🔴 4e — WHAT A `villaSession` ENTRY ACTUALLY ASSERTS. Read this before trusting it.
       * It means: "for this villa, the human cleared Turnstile and we put the credentials in the
       * fields." It does NOT mean "this villa is logged in" — the Helper never sees the login
       * response. Observing that would be portal submit detection (4i), which is NOT in
       * iteration 1. Everything downstream must treat it as a CUE, never as an authorization.
       */
      var state = {
        worklist: [],
        activeVilla: null,
        villaSession: Object.create(null),

        // ── A-WEB-4d additions ──────────────────────────────────────────────────────────
        /**
         * Helper-LOCAL row facts, keyed by `filing_id`. These are NOT backend statuses and are
         * never sent anywhere (mockup H2 GAP-B: "downloaded is Helper-local and must not be
         * sent to a backend status"). `{ downloadPath, downloadError, submitted }`.
         */
        rowLocal: Object.create(null),
        /** The postponed group is COLLAPSED by default (014 §2.5). Survives a re-render. */
        postponedOpen: false,
        /**
         * 🔴 The bucket boundary, captured ONCE. 014 §2.1 / §7.1 Q2 / 007 GAP-6: NO countdown,
         * NO live timer, ever. Every re-render (download, mark-submitted) reuses this instant,
         * so a row can never migrate buckets while the operator is looking at it.
         */
        renderNow: 0,
        /** Filled by `renderList`, read by `renderCount`. */
        buckets: null,
        /** Transient status-line note, e.g. `sheet downloaded ✓`. */
        statusNote: null,

        // ── A-WEB-4e addition ───────────────────────────────────────────────────────────
        /**
         * The portal slot of the status line: `waiting for captcha…` → `credentials filled ✓`
         * (mockup H8). `{ text, cls }` or null. Belongs to the ACTIVE villa and is cleared the
         * moment the selection moves, so it can never describe the wrong villa's portal.
         */
        portalStatus: null,
      };

      var listeners = [];

      var el = {
        list: document.getElementById('list'),
        count: document.getElementById('count'),
        statusline: document.getElementById('statusline'),
        portal: document.getElementById('portal'),
        portalMsg: document.getElementById('portal-msg'),
        urlbox: document.getElementById('urlbox'),
        loadingBar: document.getElementById('loading-bar'),
        back: document.getElementById('btn-back'),
        fwd: document.getElementById('btn-fwd'),
        reload: document.getElementById('btn-reload'),
      };

      // ── selection plumbing ─────────────────────────────────────────────────────────────
      // Clicking a row makes its VILLA active. The villa — not the row — is the unit, because
      // the villa is the portal-session boundary (014 §7.2). 4e subscribes via
      // `onActiveVillaChange` and autofills that villa's account; 4c fires the event and moves
      // the highlight, and does nothing to the portal.

      /** The account for a villa, or null. Absent credentials is normal, not an error. */
      function accountFor(villa) {
        for (var i = 0; i < state.worklist.length; i += 1) {
          if (state.worklist[i].villa === villa && state.worklist[i].account) {
            return state.worklist[i].account;
          }
        }
        return null;
      }

      /**
       * 🔴 A-WEB-4e — THE DEFINITION OF "LOCKED", and the one line that keeps it from becoming
       * 4d's dead worklist.
       *
       * Locked = this villa HAS credentials but no session yet. A CRED-LESS villa is **never**
       * locked: it is `manual login` (014 §7.9 — the NORMAL launch state), the human types the
       * password themselves, and the Helper has no way to observe that. Gating anything on a
       * session a cred-less villa can never acquire would kill the exact rows that ship first.
       *
       * This matches `renderVillaGroup`'s class precedence exactly — `no-acct` BEFORE `locked` —
       * so the group art and the row affordances can never disagree.
       */
      function isLocked(villa) {
        return !!accountFor(villa) && !state.villaSession[villa];
      }

      function setActiveVilla(villa) {
        if (state.activeVilla === villa) return;
        state.activeVilla = villa;

        var rows = el.list.querySelectorAll('[data-villa]');
        for (var i = 0; i < rows.length; i += 1) {
          rows[i].classList.toggle('sel', rows[i].getAttribute('data-villa') === villa);
        }

        renderStatusLine();
        document.title = villa ? 'TM30 Helper — ' + villa : 'TM30 Helper';

        var account = villa ? accountFor(villa) : null;
        for (var j = 0; j < listeners.length; j += 1) {
          try {
            listeners[j]({ villa: villa, account: account, session: state.villaSession[villa] || null });
          } catch (err) {
            console.error('[tm30-helper] an active-villa listener threw', err);
          }
        }
      }

      /** 4e/4f attach here. Returns an unsubscribe. */
      function onActiveVillaChange(fn) {
        listeners.push(fn);
        return function () {
          var i = listeners.indexOf(fn);
          if (i >= 0) listeners.splice(i, 1);
        };
      }

      // ═══════════════════════════════════════════════════════════════════════════════════
      // A-WEB-4d — THE FILING WORKLIST PANE (014 §7.2, §3; mockup H2 + H4)
      //
      // This replaces 4c's placeholder flat list. Structure, top to bottom:
      //
      //   [ ▶ postponed (24h+) · N villas · M filings ]   ← collapsed by default, hidden if empty
      //   ── within 24h ──────────────────────────────
      //   [ villa group ] rows…                          ← most-urgent group first
      //   [ villa group ] rows…
      //   [ villa group ] rows…                          ← AMB-5: finished groups sink here
      //
      // What it deliberately does NOT do:
      //   · 4e — autofill. Nothing here calls `webview.executeJavaScript`. The group's session
      //     pill reads `state.villaSession`, which ONLY 4e ever writes.
      //   · record a submission. 4f's `✓ Mark as submitted` opens `return_url` in the operator's
      //     REAL browser and stops there; the web tab records it (005 §8.4).
      // ═══════════════════════════════════════════════════════════════════════════════════

      var POSTPONED_AFTER_MS = 24 * 60 * 60 * 1000;
      var DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      var MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                         'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

      /**
       * The six row states, and the mockup H2 art each one wears. `label` is the badge text.
       *
       * 🔴 This is a RENDERING of server fields, not a state machine. `overdue` comes from
       * `row.dot`, which the server computed; `downloaded` is Helper-local and never leaves the
       * process (mockup H2 GAP-B). Nothing here re-derives urgency.
       */
      var STATE_ART = {
        need:       { row: 's-need',  badge: 'b-need',  label: 'need upload' },
        downloaded: { row: 's-dl',    badge: 'b-dl',    label: 'downloaded' },
        awaiting:   { row: 's-await', badge: 'b-await', label: 'awaiting approval' },
        approved:   { row: 's-sub',   badge: 'b-sub',   label: 'approved' },
        overdue:    { row: 's-over',  badge: 'b-over',  label: 'overdue' },
        nosheet:    { row: 's-block', badge: 'b-block', label: 'no sheet yet' },
      };

      /** A group whose every row is in one of these has nothing left to do → AMB-5 sink. */
      function isFinishedState(s) { return s === 'awaiting' || s === 'approved'; }

      /**
       * The check-in as UTC midnight of its DAY.
       *
       * 🔴 Day precision, deliberately (A-BE-5 finding #2: the source column is `DATEONLY`
       * unless a check-in-event override exists; the 4a′ redraw dropped `· 12:00 ·` for exactly
       * this reason). Parsed off the ISO STRING rather than through `new Date()` so the local
       * timezone cannot shift a check-in onto the wrong day — the bug that would silently
       * mis-bucket every filing for anyone west of UTC.
       *
       * @returns {number|null} epoch ms, or null when `checkin` is unusable.
       */
      function checkinDayMs(checkin) {
        var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(checkin || ''));
        if (!m) return null;
        return Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      }

      /** `Fri 18 Jul` — the whole label the mockup draws. No clock (014 §2.1). */
      function formatCheckinDay(checkin) {
        var ms = checkinDayMs(checkin);
        if (ms === null) return '—';
        var d = new Date(ms);
        return DAY_NAMES[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MONTH_NAMES[d.getUTCMonth()];
      }

      /**
       * Is this check-in the CURRENT day? Compared in UTC on both sides, because the check-in
       * is a UTC-midnight `DATEONLY` (A-BE-5 finding #2) — mixing a UTC date against a local
       * one is how a row lands on the wrong day either side of midnight. Uses the same
       * captured `state.renderNow`, so it is a snapshot like everything else here, not a clock.
       */
      function isToday(checkin) {
        var ms = checkinDayMs(checkin);
        if (ms === null) return false;
        var now = new Date(state.renderNow);
        return ms === Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
      }

      /**
       * Which bucket a row falls in. **Per ROW, not per villa** — AMB-1 (2026-07-20): a villa
       * straddling the boundary renders in BOTH buckets, and its postponed filing is never
       * promoted just because a sibling is urgent. The villa group is a rendering inside each
       * bucket, not an atomic unit that drags its members across.
       *
       * The boundary is the check-in (014 §7.1 Q2), measured against `state.renderNow` — an
       * instant captured ONCE, never a ticking clock.
       */
      function isPostponed(row) {
        var ms = checkinDayMs(row.checkin);
        if (ms === null) return false; // unusable check-in → keep it in front of the operator
        return ms > state.renderNow + POSTPONED_AFTER_MS;
      }

      /**
       * The row's display state. Precedence runs finished → blocked → local → urgency.
       *
       * 🔴 `row.dot` is READ, never computed. 014 §7.3 defect 3 / `Tm30CollectionItem`: "MUST
       * equal getTm30DotState — never recomputed client-side". The `when` line below shows the
       * dot's urgency independently, so a row never loses its Due/Overdue signal to this
       * precedence order.
       */
      function rowState(row) {
        var local = state.rowLocal[row.filing_id];
        if (row.status === 'acknowledged') return 'approved';
        if (row.status === 'submitted' || (local && local.submitted)) return 'awaiting';
        if (!row.sheet_download_url) return 'nosheet';
        if (local && local.downloadPath) return 'downloaded';
        if (row.dot === 'overdue') return 'overdue';
        return 'need';
      }

      /**
       * Groups rows by villa, PRESERVING ARRAY ORDER.
       *
       * AMB-4 (closed by existing code): the backend already sorts check-in → `filing_id`
       * (`tm30.service.ts:143-147`), so a group's position is its first member's position and
       * "most-urgent group first / most-urgent row first" falls out for free. Re-sorting here
       * against a locally-derived key is exactly how the two halves drift apart — so we don't.
       */
      function groupByVilla(rows) {
        var order = [];
        var byVilla = Object.create(null);

        rows.forEach(function (row) {
          if (!byVilla[row.villa]) {
            byVilla[row.villa] = [];
            order.push(row.villa);
          }
          byVilla[row.villa].push(row);
        });

        return order.map(function (villa) {
          var members = byVilla[villa];
          return {
            villa: villa,
            rows: members,
            finished: members.every(function (r) { return isFinishedState(rowState(r)); }),
          };
        });
      }

      /** AMB-5: fully-finished villa groups SINK below the actionable ones. Stable. */
      function sinkFinished(groups) {
        var actionable = groups.filter(function (g) { return !g.finished; });
        var done = groups.filter(function (g) { return g.finished; });
        return actionable.concat(done);
      }

      // ── row actions ────────────────────────────────────────────────────────────────────

      /**
       * ⬇ xlsx — THE trick (005 §8.3.1). No DOM automation, no upload robot: the Helper puts
       * the sheet on the operator's disk and the human uploads it in the portal pane by hand.
       * That is the entire "connect Excel to the portal" mechanism, and it is why this is the
       * one and only byte the Helper ever pulls (014 §2.5 stands — this is a user-initiated
       * FILE download, not a data fetch).
       */
      function downloadSheet(row, btn) {
        if (!row.sheet_download_url) return;

        if (!window.tm30Native) {
          console.error('[tm30-helper] tm30Native bridge is missing — preload did not load');
          setStatusNote('download unavailable — the native bridge did not load', 'st-none');
          return;
        }

        btn.disabled = true;
        btn.textContent = '⬇ downloading…';

        window.tm30Native.downloadSheet(row.sheet_download_url).then(function (res) {
          if (res && res.ok) {
            state.rowLocal[row.filing_id] = state.rowLocal[row.filing_id] || {};
            state.rowLocal[row.filing_id].downloadPath = res.path;
            state.rowLocal[row.filing_id].downloadError = null;
            // 4a′ PO ruling: English. (v1 said `лист скачан ✓`.)
            setStatusNote('sheet downloaded ✓ · ' + res.path, 'st-ok');
          } else {
            var why = (res && res.error) || 'unknown error';
            state.rowLocal[row.filing_id] = state.rowLocal[row.filing_id] || {};
            state.rowLocal[row.filing_id].downloadError = why;
            setStatusNote('download failed — ' + why, 'st-none');
          }
          renderList();
        });
      }

      /** 📁 — hand the Drive folder to the human's real browser (005 §8.3.1 escape hatch). */
      function openFolder(row) {
        if (!row.folder_url || !window.tm30Native) return;
        window.tm30Native.openExternal(row.folder_url);
      }

      /**
       * Can this row's hand-back actually go anywhere?
       *
       * `return_url` is built WEB-side by the 4b emitter from `booking_id` (014 §7.3 defect 2 —
       * routing is the web's business), and `deeplink.js` only copies it across when it is a
       * string. A row can therefore arrive without one — from an older link, or a payload built
       * before the emitter existed. 014 §7.9: that is stated, never papered over. `shell` also
       * refuses anything that is not http(s) (`main.js` `isHttpUrl`), so the same rule is
       * applied here rather than firing an IPC that is guaranteed to come back `ok:false`.
       */
      function canHandBack(row) {
        return typeof row.return_url === 'string' && /^https?:\/\//i.test(row.return_url);
      }

      /**
       * ✓ Mark as submitted — A-WEB-4f, THE HAND-BACK (005 §8.4).
       *
       * 🔴 THIS FUNCTION OPENS A URL. THAT IS THE WHOLE FEATURE.
       * `return_url` goes to the operator's DEFAULT BROWSER — never the portal `<webview>`, never
       * a Helper request. The browser is where the manager's logged-in mo-reservation-fe session
       * lives; the webview holds a Thai-immigration session and knows nothing about our cookies.
       * The web tab then reads `confirm=submitted`, opens its confirm panel, takes the optional
       * receipt number, and calls endpoint #9 with the user who is actually signed in.
       *
       * WHY THE HELPER DOES NOT CALL #9 ITSELF: iteration 1 gives the Helper no credentials and
       * no network (014 §2.5 — it could not authenticate the attestation even if it wanted to),
       * and `submitted_by` must be a real human's assent, captured where that human is
       * identified. Iteration 2 (005 §8.4) revisits this with a short-lived token; not now.
       *
       * ⚠️ WHAT THE OPTIMISTIC FLIP DOES AND DOES NOT MEAN. `local.submitted` is set only after
       * the OS confirms it opened the browser — that is the last fact the Helper ever learns.
       * Whether the manager then pressed Confirm, typed a receipt, or closed the tab is
       * invisible from here. So the flag is DISPLAY-ONLY (`local`, never persisted, never sent),
       * the row says so in words, and the button stays live to reopen the confirm. The true
       * status arrives the only way it can: the next worklist regenerated from the web.
       */
      function markSubmitted(row) {
        var local = (state.rowLocal[row.filing_id] = state.rowLocal[row.filing_id] || {});

        if (!canHandBack(row)) {
          local.handbackError = 'this row has no usable return link';
          setStatusNote('no return link on this row — nothing was opened', 'st-none');
          renderList();
          return;
        }
        if (!window.tm30Native) {
          local.handbackError = 'the native bridge did not load';
          setStatusNote('hand-back unavailable — the native bridge did not load', 'st-none');
          renderList();
          return;
        }

        window.tm30Native.openExternal(row.return_url).then(function (res) {
          if (res && res.ok) {
            local.handbackError = null;
            local.submitted = true; // optimistic, display-only — see the ⚠️ above
            setStatusNote('opened the web confirm in your browser — finish it there', 'st-ok');
          } else {
            local.handbackError = (res && res.error) || 'unknown error';
            setStatusNote('could not open your browser — ' + local.handbackError, 'st-none');
          }
          renderList();
        });
      }

      // ── the render ─────────────────────────────────────────────────────────────────────

      /** One `.row` — mockup H2. AMB-6: the label is villa + check-in DATE and nothing else. */
      function renderRow(row) {
        var kind = rowState(row);
        var art = STATE_ART[kind];
        var local = state.rowLocal[row.filing_id] || {};

        var box = document.createElement('div');
        box.className = 'row ' + art.row + (row.villa === state.activeVilla ? ' sel' : '');
        box.setAttribute('data-villa', row.villa);
        box.setAttribute('data-filing-id', row.filing_id);
        box.setAttribute('role', 'button');
        box.setAttribute('tabindex', '0');

        // ── top: villa + check-in day, and the badge ──
        var top = document.createElement('div');
        top.className = 'row-top';

        var left = document.createElement('div');
        var villa = document.createElement('div');
        villa.className = 'villa';
        villa.textContent = row.villa; // one name, never split (009 §10)

        var when = document.createElement('div');
        when.className = 'when';
        when.textContent = formatCheckinDay(row.checkin);
        /**
         * The server's dot, rendered as-is — the ONLY urgency signal on the row.
         *
         * ⚠️ `dot: 'due'` means "not overdue", NOT "due today" (`getTm30DotState` /
         * `Tm30SubmissionStatus`). Printing "Due today" on every non-overdue row labelled a
         * check-in four days out as due today — caught rendering the postponed bucket. So the
         * words are chosen by the calendar day, while the STATE is still the server's alone:
         * `overdue` always shows, `due` shows "Due today" only on a row that really is today,
         * and otherwise the date stands by itself (which is what the mockup draws for the
         * postponed rows). This is label formatting, not a re-derived dot.
         */
        if (row.dot === 'overdue') {
          when.appendChild(document.createTextNode(' · '));
          var over = document.createElement('span');
          over.className = 'over';
          over.textContent = 'Overdue';
          when.appendChild(over);
        } else if (row.dot === 'due' && isToday(row.checkin)) {
          when.appendChild(document.createTextNode(' · '));
          var due = document.createElement('span');
          due.className = 'due';
          due.textContent = 'Due today';
          when.appendChild(due);
        }
        left.appendChild(villa);
        left.appendChild(when);

        var badge = document.createElement('span');
        badge.className = 'badge ' + art.badge;
        badge.textContent = art.label;

        top.appendChild(left);
        top.appendChild(badge);
        box.appendChild(top);

        // ── actions: status · xlsx · folder, always all three, disabled not hidden ──
        var acts = document.createElement('div');
        acts.className = 'acts';

        var statusBtn = document.createElement('button');
        statusBtn.type = 'button';
        statusBtn.className = 'btn act-status';
        if (kind === 'approved') {
          statusBtn.classList.add('done');
          statusBtn.textContent = '✓ Approved';
          statusBtn.disabled = true;
        } else if (kind === 'awaiting' && !(local.submitted && row.status !== 'submitted')) {
          statusBtn.classList.add('done');
          statusBtn.textContent = '✓ Submitted';
          statusBtn.disabled = true;
        } else if (kind === 'awaiting') {
          /**
           * 4f: `submitted` here is the LOCAL optimistic flag, not the server's — we opened the
           * browser and then went blind. A dead `✓ Submitted` would be the Helper claiming an
           * outcome it never saw, and would strand an operator whose browser tab got closed
           * before they confirmed. So the control stays live and says exactly what it is.
           */
          statusBtn.textContent = '↗ Reopen web confirm';
          statusBtn.title =
            'The Helper only opened your browser — it cannot see whether you confirmed. ' +
            'Reopen the web confirm if you did not finish it.';
          statusBtn.disabled = !canHandBack(row);
          statusBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            markSubmitted(row);
          });
        } else {
          /**
           * 🔴 A-WEB-4e — THE 4d `TODO(4e)` DIM, RESOLVED. Read the whole comment before
           * changing this, because both of the obvious moves are wrong.
           *
           * WHAT LOCKING GATES: the `✓ Mark as submitted` CUE, and nothing else. On a locked
           * villa the button drops `.primary` — it stops *inviting* the click — and says why on
           * hover. That is the whole dim.
           *
           * WHAT LOCKING MUST NOT GATE, and why:
           *   · ⬇ xlsx — a DRIVE download, wholly independent of the portal. The real sequence
           *     is download-the-sheet THEN log in to upload it, so gating the download on the
           *     login inverts the operator's own order and deadlocks the pane (4d's correct
           *     objection; the reason 4d deferred the dim rather than shipping it).
           *   · 📁 folder — likewise a Drive link, handed to the human's own browser.
           *   · the rows themselves — 4d's dead-worklist trap. Nothing here is disabled by lock.
           *
           * WHY THE BUTTON IS DIMMED BUT **NOT DISABLED**: a session entry only proves *we*
           * autofilled (see `state.villaSession`). An operator who typed the password by hand,
           * or who works a cred-less villa, has genuinely submitted and must still be able to
           * say so. A hard disable would make this attestation unreachable for exactly the
           * people doing the work manually. The lock lowers the invitation; it never takes the
           * control away.
           */
          var locked = isLocked(row.villa);
          if (locked) {
            statusBtn.title =
              'Log in to this villa in the portal first — select the villa and solve the ' +
              'captcha. You can still mark it submitted if you logged in by hand.';
          } else {
            statusBtn.classList.add('primary');
          }
          statusBtn.textContent = '✓ Mark as submitted';
          // nothing was uploaded → nothing to attest; no return link → nowhere to hand back to.
          statusBtn.disabled = kind === 'nosheet' || !canHandBack(row);
          if (!canHandBack(row)) {
            // 🔴 Loud, not silent (014 §7.9). A dead button with no reason is the same bug.
            statusBtn.classList.remove('primary');
            statusBtn.title =
              'This row arrived without a usable return link, so the Helper cannot open the ' +
              'web confirm. Reopen the Helper from the web tab to get a fresh link.';
          }
          statusBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            markSubmitted(row);
          });
        }

        var sheetBtn = document.createElement('button');
        sheetBtn.type = 'button';
        sheetBtn.className = 'btn act-sheet';
        sheetBtn.textContent = '⬇ xlsx';
        if (!row.sheet_download_url) {
          // `no sheet yet` — D-2 has not generated it. Disabled, never absent (mockup H2).
          sheetBtn.disabled = true;
          sheetBtn.title = 'The sheet is generated from D-2 — nothing to download yet.';
        } else {
          sheetBtn.title = 'Download the sheet to your Downloads folder';
          sheetBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            downloadSheet(row, sheetBtn);
          });
        }

        var folderBtn = document.createElement('button');
        folderBtn.type = 'button';
        folderBtn.className = 'btn act-folder';
        folderBtn.textContent = '📁';
        folderBtn.title = 'Open the Drive folder';
        folderBtn.setAttribute('aria-label', 'Open the Drive folder');
        folderBtn.disabled = !row.folder_url;
        folderBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          openFolder(row);
        });

        acts.appendChild(statusBtn);
        acts.appendChild(sheetBtn);
        acts.appendChild(folderBtn);
        box.appendChild(acts);

        // ── the explanatory line, when the state has something to say ──
        var msg = '';
        if (local.handbackError) msg = 'hand-back failed — ' + local.handbackError;
        else if (kind !== 'approved' && row.status !== 'submitted' && !canHandBack(row))
          // 4f: stated on the row, not just hidden in a tooltip on a greyed button.
          msg = 'No usable return link on this row — reopen the Helper from the web tab.';
        else if (local.downloadError) msg = 'download failed — ' + local.downloadError;
        else if (local.submitted && row.status !== 'submitted')
          /**
           * 🔴 The Helper's honesty line (4f). It opened a browser and learned nothing after
           * that, so it must not read like `✓ Submitted` — the server's own word, which arrives
           * only with the next worklist.
           */
          msg = 'Marked here after opening the web confirm — the Helper cannot see whether it ' +
                'was recorded. The real status comes back with the next worklist.';
        else if (local.downloadPath) msg = 'sheet downloaded ✓ · ' + local.downloadPath;
        else if (kind === 'nosheet') msg = 'Sheet is generated from D-2 — nothing to upload yet.';
        else if (kind === 'awaiting') msg = 'Sent to immigration — verdict not back yet.';
        else if (kind === 'approved') msg = 'Nothing left to do here — the report was uploaded on the web tab.';

        if (msg) {
          var line = document.createElement('div');
          line.className = 'rowmsg';
          line.textContent = msg;
          box.appendChild(line);
        }

        // Selection plumbing, unchanged from 4c: the click makes the VILLA active.
        box.addEventListener('click', function () { setActiveVilla(row.villa); });
        box.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            setActiveVilla(row.villa);
          }
        });

        return box;
      }

      /**
       * One villa group — the SESSION unit (014 §7.2). The header owns the login; the rail down
       * the body is "this login owns these filings", drawn.
       *
       * The pill reads `state.villaSession[villa]` — keyed by VILLA, never by group box (AMB-1).
       * 4e writes that map on a successful autofill, and the pill turns green with no change
       * here — the seam 4d left worked as designed.
       *
       * ⚠️ The `locked` CLASS carries no rule of its own: `.vgroup-h`'s amber `border-left` and
       * `.vg-body`'s amber rail ARE the locked look, and `open-session` / `no-acct` override
       * them. So `locked` is the DEFAULT state of a credentialed group, which is correct — a
       * freshly-opened Helper has solved no captchas.
       *
       * ⚠️ The mockup also dims a locked group's row ACTIONS. 4e applies that to exactly one
       * affordance — see the long comment on the `✓ Mark as submitted` button in `renderRow`.
       * The ⬇ download and 📁 folder are Drive-side and stay live at all times.
       */
      function renderVillaGroup(group) {
        var account = accountFor(group.villa);
        var session = state.villaSession[group.villa] || null;

        var box = document.createElement('div');
        box.className = 'vgroup' +
          (!account ? ' no-acct' : session ? ' open-session' : ' locked') +
          (group.finished ? ' finished' : '') +
          (group.villa === state.activeVilla ? ' sel' : '');
        box.setAttribute('data-villa', group.villa);

        var head = document.createElement('button');
        head.type = 'button';
        head.className = 'vgroup-h';
        head.setAttribute('data-villa', group.villa);

        var id = document.createElement('div');
        id.className = 'vg-id';
        var name = document.createElement('div');
        name.className = 'vg-name';
        name.textContent = group.villa;
        var acct = document.createElement('div');
        if (account) {
          acct.className = 'vg-acct';
          acct.textContent = account.login;
        } else {
          // Calm and first-class: on day one this is most villas, not a fault (014 §7.9).
          acct.className = 'vg-acct none';
          acct.textContent = 'no portal credentials yet';
        }
        id.appendChild(name);
        id.appendChild(acct);

        var pill = document.createElement('span');
        if (!account) {
          pill.className = 'vg-pill manual';
          pill.textContent = 'manual login';
        } else if (session) {
          pill.className = 'vg-pill open';
          pill.textContent = '🔓 session open';
        } else {
          pill.className = 'vg-pill locked';
          pill.textContent = '🔒 log in';
        }

        head.appendChild(id);
        head.appendChild(pill);
        head.addEventListener('click', function () { setActiveVilla(group.villa); });
        box.appendChild(head);

        var body = document.createElement('div');
        body.className = 'vg-body';
        group.rows.forEach(function (row) { body.appendChild(renderRow(row)); });
        box.appendChild(body);

        return box;
      }

      /** The collapsible "postponed (24h+)" group. Hidden entirely when empty (014 §2.5). */
      function renderPostponedGroup(groups) {
        var filings = groups.reduce(function (n, g) { return n + g.rows.length; }, 0);

        var box = document.createElement('div');
        box.className = 'group' + (state.postponedOpen ? ' open' : '');

        var head = document.createElement('button');
        head.type = 'button';
        head.className = 'group-h';
        head.setAttribute('aria-expanded', state.postponedOpen ? 'true' : 'false');

        var chev = document.createElement('span');
        chev.className = 'chev';
        chev.textContent = '▶';
        head.appendChild(chev);
        head.appendChild(document.createTextNode('postponed (24h+) '));

        var sub = document.createElement('span');
        sub.className = 'sub';
        sub.textContent = '· ' + groups.length + ' villa' + (groups.length === 1 ? '' : 's') +
          ' · ' + filings + ' filing' + (filings === 1 ? '' : 's');
        head.appendChild(sub);

        head.addEventListener('click', function () {
          state.postponedOpen = !state.postponedOpen;
          renderList();
        });
        box.appendChild(head);

        if (state.postponedOpen) {
          var body = document.createElement('div');
          body.className = 'group-body';
          groups.forEach(function (g) { body.appendChild(renderVillaGroup(g)); });
          box.appendChild(body);
        }

        return box;
      }

      /**
       * 🔴 THE 4d SEAM (replaces 4c's placeholder). Everything the shell relies on is kept:
       * every clickable element carries `data-villa`, and clicking calls `setActiveVilla`.
       * `state.villaSession` is NOT re-keyed per group — it stays villa-keyed (AMB-1).
       */
      function renderList() {
        // The instant is captured ONCE, on the first render, and reused by every re-render.
        // A row must never change bucket because the operator took a minute to read it.
        if (!state.renderNow) state.renderNow = Date.now();

        el.list.textContent = '';

        if (!state.worklist.length) {
          var empty = document.createElement('div');
          empty.className = 'empty';
          empty.innerHTML =
            '<div style="font-size:26px">✓</div>' +
            '<div class="big">Nothing to file today</div>' +
            '<div class="sm">Every filing within the next 24 hours is submitted. ' +
            'Re-open from the web to refresh this list.</div>';
          el.list.appendChild(empty);
          state.buckets = { postponed: [], main: [] };
          return;
        }

        var postponedRows = [];
        var mainRows = [];
        state.worklist.forEach(function (row) {
          (isPostponed(row) ? postponedRows : mainRows).push(row);
        });

        var postponedGroups = groupByVilla(postponedRows);
        var mainGroups = sinkFinished(groupByVilla(mainRows));
        state.buckets = { postponed: postponedGroups, main: mainGroups };

        if (postponedGroups.length) {
          el.list.appendChild(renderPostponedGroup(postponedGroups));

          var divider = document.createElement('div');
          divider.className = 'divider';
          divider.textContent = 'within 24h';
          el.list.appendChild(divider);
        }

        mainGroups.forEach(function (g) { el.list.appendChild(renderVillaGroup(g)); });
      }

      /** Mockup H4: `4 villas · 5 within 24h`. Reads the buckets `renderList` just computed. */
      function renderCount() {
        if (!state.worklist.length) {
          el.count.textContent = '0';
          return;
        }
        var main = (state.buckets && state.buckets.main) || [];
        var villas = main.length;
        var filings = main.reduce(function (n, g) { return n + g.rows.length; }, 0);
        el.count.textContent =
          villas + ' villa' + (villas === 1 ? '' : 's') + ' · ' + filings + ' within 24h';
      }

      // ── status line (mockup H8) ────────────────────────────────────────────────────────
      // AMB-8 (unspecified at the gate): with NO villa active yet, the account slot would name a
      // login that has not happened. We take the gate's own "show the count" option instead.
      // 4e appends the captcha-wait / ✓ credentials filled states; 4c owns the account slot only.
      function renderStatusLine() {
        el.statusline.textContent = '';

        function add(text, cls) {
          var s = document.createElement('span');
          if (cls) s.className = cls;
          s.textContent = text;
          el.statusline.appendChild(s);
          return s;
        }
        function sep() { add('·', 'sep'); }

        if (!state.activeVilla) {
          add(state.worklist.length ? 'Select a villa to start' : 'Nothing to file', 'st-none');
        } else {
          add(state.activeVilla, 'st-acct');
          sep();

          var account = accountFor(state.activeVilla);
          if (account) {
            add(account.login);
          } else {
            // Calm and first-class: on day one this is most villas, not a fault.
            add('no credentials — log in manually', 'st-none');
          }

          /**
           * 4e's portal slot (mockup H8): `waiting for captcha…` → `credentials filled ✓`.
           * These are the 4a′ English translations of v1's `ждём капчу…` / `✓ подставлено`
           * (`window.html:123,204`) — same two states, same order, same meaning.
           *
           * A cred-less villa leaves this slot EMPTY on purpose: the account slot directly to
           * its left already reads `no credentials — log in manually`, and saying it twice in
           * one line reads like a warning about a state that is simply normal (014 §7.9).
           */
          if (state.portalStatus) {
            sep();
            add(state.portalStatus.text, state.portalStatus.cls);
          }
        }

        // 4d: the download's own line — `sheet downloaded ✓` (4a′ PO ruling: English).
        // Pushed right so it never fights the account slot 4c owns, or 4e's captcha-wait.
        if (state.statusNote) {
          add('', 'spacer');
          add(state.statusNote.text, state.statusNote.cls || 'st-ok');
        }
      }

      /** 4d's slot in the status line. `null` clears it. */
      function setStatusNote(text, cls) {
        state.statusNote = text ? { text: text, cls: cls } : null;
        renderStatusLine();
      }

      // ── right pane: the portal webview ─────────────────────────────────────────────────
      // The webview is stood up and pointed at the portal. That is ALL 4c does with it.
      // No executeJavaScript, no autofill (4e), no submit detection (4i). Portal NO-GO, 010 §8.
      function mountPortal() {
        el.urlbox.textContent = TM30_URL;

        el.back.addEventListener('click', function () {
          if (el.portal.canGoBack()) el.portal.goBack();
        });
        el.fwd.addEventListener('click', function () {
          if (el.portal.canGoForward()) el.portal.goForward();
        });
        el.reload.addEventListener('click', function () { el.portal.reload(); });

        el.portal.addEventListener('did-start-loading', function () {
          el.loadingBar.style.width = '70%';
        });
        el.portal.addEventListener('did-stop-loading', function () {
          el.loadingBar.style.width = '100%';
          setTimeout(function () { el.loadingBar.style.width = '0%'; }, 300);
          el.portalMsg.classList.add('hidden');
          el.back.disabled = !el.portal.canGoBack();
          el.fwd.disabled = !el.portal.canGoForward();
          el.reload.disabled = false;
        });

        function syncUrl(e) {
          if (e.url && e.url !== 'about:blank') el.urlbox.textContent = e.url;
        }
        el.portal.addEventListener('did-navigate', syncUrl);
        el.portal.addEventListener('did-navigate-in-page', syncUrl);

        el.portal.addEventListener('did-fail-load', function (e) {
          if (e.errorCode === -3 || !e.isMainFrame) return; // -3 = user-aborted
          el.loadingBar.style.width = '0%';
          el.portalMsg.classList.remove('hidden');
          el.portalMsg.innerHTML =
            '<div class="icon">⚠️</div>' +
            '<div>Could not load <b></b></div>' +
            '<div class="hint"></div>';
          el.portalMsg.querySelector('b').textContent = e.validatedURL || TM30_URL;
          el.portalMsg.querySelector('.hint').textContent =
            (e.errorDescription || 'network error') +
            ' — the portal is reached through your own session; try Reload, or open it by hand.';
        });
      }

      // ═══════════════════════════════════════════════════════════════════════════════════
      // A-WEB-4e — CREDENTIAL AUTOFILL + THE VILLA SESSION (005 §8.1/§8.3, 014 §3; mockup H5)
      //
      // ┌─ 🔴 PORTAL NO-GO — 010 §8, 005 §8.1. THE LINE THIS WHOLE FEATURE IS BUILT AROUND ──┐
      // │                                                                                    │
      // │  The Helper puts the LOGIN and the PASSWORD into two input fields. That is the     │
      // │  entire contract with the portal. It does not:                                     │
      // │                                                                                    │
      // │    · click Log in, or submit any form         · solve, bypass or read Turnstile    │
      // │    · navigate the portal                      · touch the upload page              │
      // │                                                                                    │
      // │  The HUMAN clears Cloudflare, presses Log in, navigates to batch upload, picks the │
      // │  downloaded sheet and submits it. 010 §8's probe is why: the portal 403s a bot even │
      // │  headful, and human-in-the-loop is the ONLY path. The one read we perform is the   │
      // │  `cf-turnstile-response` VALUE — read to know when the field will accept typing,   │
      // │  never to produce or replay a token. It is v1's poller, unchanged.                 │
      // │                                                                                    │
      // │  If you are adding a `.click()`, a `.submit()`, or a `loadURL` in this section, the │
      // │  answer is no.                                                                     │
      // └────────────────────────────────────────────────────────────────────────────────────┘
      //
      // Still ZERO Helper network calls (014 §2.5): this injects script into the page the
      // HUMAN's webview session already loaded. Nothing is fetched.
      // ═══════════════════════════════════════════════════════════════════════════════════

      /** v1's cadences, kept (`window.html:192,209`) — they are field-proven against the portal. */
      var AUTOFILL_POLL_MS = 400;
      var FILLED_WATCH_MS = 600;

      /**
       * The in-flight autofill, or an empty slot. Exactly ONE villa is ever pending: selecting a
       * second villa supersedes the first rather than racing it.
       */
      var autofill = { villa: null, login: null, pass: null, token: null, watch: null };
      var autofillSeq = 0;

      /**
       * v1's `buildAutofillScript` (`window.html:163-206`), MIRRORED — the selectors are the
       * portal DOM knowledge v1 earned in production and this ticket must not re-invent:
       *
       *   · `#user` / `#pass`                      the login fields, by id
       *   · `input[name="cf-turnstile-response"]`  Cloudflare's hidden token field; non-empty
       *                                            value ⇒ the human cleared the challenge
       *   · the native `HTMLInputElement.value` setter + input/change/keyup
       *                                            the React-controlled-input workaround, without
       *                                            which the framework overwrites the typed value
       *   · a 400ms poller, because the portal renders Turnstile BEFORE the login form — firing
       *     on load would inject into fields that do not exist yet
       *
       * ⚠️ INTEGRATION ITEM — THE ONE THING THIS TICKET COULD NOT VERIFY (4e, 2026-07-21).
       * A read-only probe of the LIVE portal (no clicking, no solving) found this at t=15s:
       *
       *     url    https://tm30.immigration.go.th/   title "Just a moment..."
       *     inputs exactly ONE — id="cf-chl-widget-8rh6t_response" name="cf-turnstile-response"
       *     #user  absent      #pass absent      forms: none      Ray ID: a1e868290e81f136
       *
       * So the challenge is a **Cloudflare interstitial**, a DIFFERENT document from the login
       * page — and the `cf-turnstile-response` we can see today belongs to the INTERSTITIAL.
       * The poller's condition is an AND across ONE document (`#user` && `#pass` && a non-empty
       * token). It is therefore unproven whether the post-challenge LOGIN page carries a
       * turnstile input of its own. If it does not, `Array.prototype.some` over an EMPTY NodeList
       * returns `false` and **autofill would never fire** — the status would sit on
       * `waiting for captcha…` forever with the fields right there in front of the operator.
       *
       * v1 shipped this exact condition and reportedly worked, which is evidence the login page
       * does carry its own widget — but it is second-hand, the portal has been re-fronted since,
       * and confirming it needs a HUMAN to solve the challenge once. That is a 20-second check at
       * integration and it must be done: click through, then read `#user`/`#pass` and the token
       * count on the page that appears. The logic is deliberately left as v1 wrote it until then
       * (the ticket's "mirror, don't reinvent" constraint) — do not "fix" this on a guess.
       *
       * THE ONE DELTA FROM v1, and why it is required here: v1 was one window per account, so a
       * bare `window.__tm30Filled = true` could never be misread. This window switches villas
       * against ONE long-lived page, where a `true` left behind by villa A is read as villa B's
       * fill the instant B is selected — silently opening a session for a villa whose credentials
       * were never typed. Note this needs NO navigation to happen: a navigation would wipe the
       * flag. It is the portal SPA-routing off the login page that leaves it set.
       *
       * TWO things stop that, and it is worth knowing which does the work:
       *   1. `window.__tm30Filled = null` at the top of this script — the PRIMARY guard. Every
       *      injection resets the flag, so a new villa starts from a clean slate.
       *   2. the per-selection TOKEN, which the watcher below matches exactly — a belt for the
       *      window between the watcher starting and the (async) injection landing, where #1 has
       *      not applied yet and a 600ms tick could still read the stale value.
       * Mutation-tested: removing BOTH fails the harness's stale-flag scenario; removing either
       * alone does not, because each covers the other's main case. Do not delete one on the
       * grounds that the harness stays green.
       */
      function buildAutofillScript(login, pass, token) {
        return `
          (function () {
            if (window.__tm30Autofill) clearInterval(window.__tm30Autofill);
            var LOGIN = ${JSON.stringify(login)};
            var PASS  = ${JSON.stringify(pass)};
            var TOKEN = ${JSON.stringify(token)};

            window.__tm30Filled = null;

            function setVal(el, v) {
              var desc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");
              desc.set.call(el, v);
              el.dispatchEvent(new Event("input",  { bubbles: true }));
              el.dispatchEvent(new Event("change", { bubbles: true }));
              el.dispatchEvent(new Event("keyup",  { bubbles: true }));
            }

            window.__tm30Autofill = setInterval(function () {
              var user = document.getElementById("user");
              var pass = document.getElementById("pass");
              if (!user || !pass) return;

              var tokens = document.querySelectorAll('input[name="cf-turnstile-response"]');
              var solved = Array.prototype.some.call(tokens, function (t) { return t.value && t.value.length > 0; });
              if (!solved) return;

              setVal(user, LOGIN);
              setVal(pass, PASS);
              clearInterval(window.__tm30Autofill);
              window.__tm30Autofill = null;
              window.__tm30Filled = TOKEN;
            }, ${AUTOFILL_POLL_MS});
          })();
        `;
      }

      /** 4e's slot in the status line. `null` clears it. */
      function setPortalStatus(text, cls) {
        state.portalStatus = text ? { text: text, cls: cls } : null;
        renderStatusLine();
      }

      /** Renderer-side only: forget the pending villa and stop polling for its flag. */
      function clearAutofillSlot() {
        if (autofill.watch) {
          clearInterval(autofill.watch);
          autofill.watch = null;
        }
        autofill.villa = null;
        autofill.login = null;
        autofill.pass = null;
        autofill.token = null;
      }

      /**
       * Leave the portal with NO villa pending: forget the slot AND kill the in-page poller.
       *
       * The in-page teardown is the part that matters for safety. Without it, deselecting a villa
       * would leave a live poller in the page still holding that villa's password, ready to type
       * it into whatever login form the human navigates to next. Killing the poller is how the
       * credential stops being pending.
       *
       * 🔴 Used ONLY when nothing replaces the pending villa. `startAutofill` deliberately does
       * NOT call this: `executeJavaScript` is async, so a teardown fired just before an injection
       * can land just AFTER it and `clearInterval` the poller it was supposed to precede — the new
       * villa would then wait for a captcha forever. The injected script's own first line already
       * clears its predecessor, so a replacing selection needs the renderer-side clear and nothing
       * more. Ordering is not a thing to rely on here; not depending on it is free.
       */
      function stopAutofill() {
        var had = !!autofill.villa;
        clearAutofillSlot();
        if (!had) return;
        try {
          el.portal.executeJavaScript(
            'if (window.__tm30Autofill) { clearInterval(window.__tm30Autofill); window.__tm30Autofill = null; }' +
              ' window.__tm30Filled = null;'
          ).catch(function () {});
        } catch (e) {
          /* webview not attached — there is no poller to stop */
        }
      }

      /**
       * (Re)inject the pending villa's script into whatever the webview is showing NOW.
       *
       * Called on selection AND on every `dom-ready`, because a navigation wipes the injected
       * poller: the human landing back on the login page after a failed attempt must get the
       * credentials again, not a dead pane. v1 hooked `dom-ready` for the same reason
       * (`window.html:197`) — it just only ever had one page to hook.
       */
      function injectAutofill() {
        if (!autofill.villa) return;
        try {
          el.portal
            .executeJavaScript(buildAutofillScript(autofill.login, autofill.pass, autofill.token))
            .catch(function (err) {
              console.warn('[tm30-helper] 4e: autofill injection was rejected', err);
            });
        } catch (e) {
          // Webview not attached yet. `dom-ready` will call us again — that IS the retry.
          console.warn('[tm30-helper] 4e: webview not ready for injection yet');
        }
      }

      /**
       * The human cleared Turnstile and the credentials went in. Open the villa's session.
       *
       * 🔴 Villa-keyed, never group-keyed (AMB-1, 014 §7.2): a villa straddling the 24h boundary
       * is DRAWN in two buckets but is ONE session, and keying this per group box would demand a
       * second Turnstile solve for the same villa — defeating the entire reason the worklist is
       * grouped. The key here is `villa` and there is no group in scope to key it by.
       *
       * No timestamp is stored. 014 §2.1 forbids countdowns, and a stored `at` is the first thing
       * a future ticket renders as "expires in…".
       */
      function openVillaSession(villa, account) {
        state.villaSession[villa] = { login: account.login, via: 'autofill' };
        console.log('[tm30-helper] 4e: session opened for villa "' + villa + '" (autofill landed)');

        // 4a′ PO ruling: English. v1 said `✓ подставлено` (`window.html:204`).
        setPortalStatus('credentials filled ✓', 'st-ok');
        renderList(); // the group's pill flips 🔒 log in → 🔓 session open, and the rail turns green
        renderCount();
      }

      /**
       * Begin autofilling `villa`. The status goes to `waiting for captcha…` IMMEDIATELY and
       * stays there until the human clears the challenge — that wait is the honest state, and it
       * is the one v1 shipped (`window.html:123`, `ждём капчу…`).
       */
      function startAutofill(villa, account) {
        clearAutofillSlot(); // NOT stopAutofill — see the ordering note on it

        autofillSeq += 1;
        var token = 'tm30-fill-' + autofillSeq;
        autofill.villa = villa;
        autofill.login = account.login;
        autofill.pass = account.pass || '';
        autofill.token = token;

        setPortalStatus('waiting for captcha…', 'st-none');
        injectAutofill();

        autofill.watch = setInterval(function () {
          if (autofill.token !== token) return; // superseded by a later selection
          var probe;
          try {
            probe = el.portal.executeJavaScript('window.__tm30Filled || null');
          } catch (e) {
            return;
          }
          probe
            .then(function (filled) {
              // Both guards matter: the token can be stale (villa switched between the call and
              // its resolution) and the flag can belong to a previous villa's fill.
              if (autofill.token !== token || filled !== token) return;
              clearInterval(autofill.watch);
              autofill.watch = null;
              openVillaSession(villa, account);
            })
            .catch(function () {
              /**
               * The page is mid-navigation, so the probe cannot run. Keep watching rather than
               * giving up (v1 cleared the interval here) — the human bouncing off a failed login
               * back to the form is a NORMAL path, and `dom-ready` will have re-injected by the
               * next tick. The watcher is bounded by selection: switching villas clears it.
               */
            });
        }, FILLED_WATCH_MS);
      }

      /**
       * 🔴 THE SEAM. 4c fires this on every selection change; 4e decides what the portal does.
       *
       * Three outcomes, and the cred-less one is the NORMAL one on day 1 (014 §7.9 — credentials
       * start empty and customers fill villa data later):
       *
       *   account, no session  → autofill, `waiting for captcha…`
       *   account, session     → nothing to do; restore `credentials filled ✓`
       *   NO account           → NOTHING is injected. The portal keeps showing the login page for
       *                          the human to fill in by hand. This is not an error and is never
       *                          rendered as one — the group pill reads `manual login` and the
       *                          status line reads `no credentials — log in manually`.
       */
      function mountAutofill() {
        // A navigation drops the injected poller; put it back for the villa still waiting.
        el.portal.addEventListener('dom-ready', function () {
          if (autofill.villa) injectAutofill();
        });

        onActiveVillaChange(function (ev) {
          if (!ev.villa) {
            stopAutofill();
            setPortalStatus(null);
            return;
          }

          if (!ev.account) {
            // 🔴 Cred-less villa. Deliberately inert. Never errored (014 §7.9).
            stopAutofill();
            setPortalStatus(null);
            console.log(
              '[tm30-helper] 4e: villa "' + ev.villa + '" has no credentials — ' +
                'no autofill; the portal pane stays up for manual login'
            );
            return;
          }

          if (state.villaSession[ev.villa]) {
            stopAutofill();
            setPortalStatus('credentials filled ✓', 'st-ok');
            return;
          }

          console.log(
            '[tm30-helper] 4e: autofilling villa "' + ev.villa + '" as "' + ev.account.login + '" — ' +
              'waiting for the human to clear Turnstile'
          );
          startAutofill(ev.villa, ev.account);
        });
      }

      /**
       * ⚠️ WHAT 4e DELIBERATELY DOES **NOT** DO ON SELECTION: navigate the webview to the portal.
       *
       * 014 §3 says "navigate the pane to the portal if needed", but that instruction predates
       * the pane existing. The `src` ATTRIBUTE already points the webview at the portal from the
       * first paint and is the single source of truth (4c's finding — assigning `.src` from
       * script silently no-ops). By the time any villa can be selected, the portal is loaded.
       *
       * So a selection-time navigation could only ever do one thing: yank the page out from under
       * a human who is mid-Turnstile, mid-upload, or mid-form, because they clicked a row to read
       * it. That is navigation automation, which is exactly what 010 §8 forbids, and it destroys
       * the session that autofill exists to help open. The human drives this pane; ‹ › ⟳ are
       * theirs. We inject into whatever they are looking at, and nothing else.
       */

      // ── boot ───────────────────────────────────────────────────────────────────────────
      var payload = readPayload();
      state.worklist = Array.isArray(payload.worklist) ? payload.worklist : [];

      renderList(); // computes the buckets…
      renderCount(); // …which this reads. Order matters.
      renderStatusLine();
      mountPortal();
      mountAutofill(); // 4e — subscribes to `onActiveVillaChange`; nothing fires until a click

      console.log(
        '[tm30-helper] app.html: two-pane shell up — ' +
          state.worklist.length + ' filing(s), ' +
          state.worklist.filter(function (r) { return r.account; }).length + ' with credentials'
      );

      /**
       * The seam 4d/4e/4f build against. Everything they need to reach is here and nowhere else.
       */
      window.tm30Shell = {
        state: state,
        setActiveVilla: setActiveVilla,
        onActiveVillaChange: onActiveVillaChange,
        accountFor: accountFor,
        renderList: renderList,
        renderStatusLine: renderStatusLine,
        /** 4d's status-line slot (right-hand side). `null` clears. */
        setStatusNote: setStatusNote,
        portal: el.portal,

        // ── 4e ──────────────────────────────────────────────────────────────────────────
        /** Has credentials, has no session. A cred-less villa is NEVER locked. */
        isLocked: isLocked,
        /** The captcha-wait slot. Exposed so a harness can read the transitions. */
        setPortalStatus: setPortalStatus,
        /** The exact script injected into the portal — asserted verbatim by the 4e harness. */
        buildAutofillScript: buildAutofillScript,
        /** The in-flight autofill slot (villa/login/token), for inspection. */
        autofill: autofill,

        // ── 4f ──────────────────────────────────────────────────────────────────────────
        /** The hand-back: opens `row.return_url` in the DEFAULT browser (005 §8.4). */
        markSubmitted: markSubmitted,
        /** Whether a row carries a usable `return_url` at all (014 §7.9). */
        canHandBack: canHandBack,
      };
    </script>
  </body>
