      function setStatusNote(text, cls) {
        state.statusNote = text ? { text: text, cls: cls } : null;
        renderStatusLine();
      }

      // ═══════════════════════════════════════════════════════════════════════════════════
      // A-WEB-4g — THE PER-VILLA WEBVIEW POOL + ↻ FRESH LOGIN
      //
      // One villa = one <webview> = one `persist:` partition = one cookie jar. The single
      // shared webview 4c stood up meant every villa's portal login landed in the SAME
      // session — logging in villa B silently replaced villa A's. The invariants:
      //
      //   · partition: `persist:tm30-v-<encodeURIComponent(villa)>` — deterministic and
      //     prefix-guarded (main.js refuses to clear anything outside `persist:tm30-`).
      //     `persist:` is REQUIRED: the cookie jar survives an app restart, so a solved
      //     Turnstile is not lost to an accidental window close.
      //   · webviews are created LAZILY on a villa's first selection, NEVER destroyed on a
      //     switch, and NEVER share a partition. Switching toggles `.hidden` and nothing
      //     else — a half-filled upload form must survive a stray click on another row; that
      //     is the reason the pool exists. Do NOT reload on switch, and do NOT "optimize" by
      //     sharing a partition: one Turnstile solve per villa is the accepted price.
      //   · 🔴 4c's race finding, now a POOL invariant: `src` and `partition` are set as
      //     ATTRIBUTES before the element is appended. `partition` is IMMUTABLE after attach —
      //     never set it on an attached element. After attach, navigation is `loadURL()`, and
      //     the ONE place allowed to call it is `freshLogin` (see the carve-out there).
      //   · every webview listener is bound PER webview at creation, records into its OWN
      //     pool entry, and repaints the SHARED chrome (urlbar, loading bar, error panel, nav
      //     buttons) ONLY while its webview is the active one — otherwise villa A's background
      //     navigation repaints villa B's urlbar.
      // ═══════════════════════════════════════════════════════════════════════════════════

      /** The one partition scheme. main.js's reset handler trusts exactly this prefix. */
      function partitionFor(villa) {
        return 'persist:tm30-v-' + encodeURIComponent(villa);
      }

      /**
       * villa → { el, url, loading, ready, everLoaded, fail }. `el` is the villa's <webview>;
       * the rest is that webview's private view of the SHARED chrome, replayed by
       * `renderPortalChrome` whenever the villa becomes active. Entries are created by
       * `ensureWebview` and never removed — the pool only grows, by design.
       */
      var portalPool = Object.create(null);
      /** The ACTIVE villa's pool entry, or null. `tm30Shell.portal` resolves through this. */
      var activePortal = null;

      /** Get-or-create the villa's pool entry. Idempotent; creation is the ONLY appending. */
      function ensureWebview(villa) {
        var rec = portalPool[villa];
        if (rec) return rec;

        var wv = document.createElement('webview');
        // 🔴 ATTRIBUTES, BEFORE APPEND — 4c's race finding + partition immutability (the
        // section box above). This `src` load is the villa's ONE selection-time navigation,
        // and it happens at CREATION; selecting the villa again only toggles visibility.
        wv.setAttribute('src', TM30_URL);
        wv.setAttribute('partition', partitionFor(villa));
        wv.setAttribute('allowpopups', '');
        wv.setAttribute('data-villa', villa);
        wv.classList.add('hidden'); // revealed by showVillaPortal

        rec = portalPool[villa] = {
          el: wv,
          url: TM30_URL,
          loading: true, // the `src` load starts the moment the element attaches
          ready: false, // webview methods throw before the first dom-ready — this is the gate
          everLoaded: false,
          fail: null,
        };
        bindPortalListeners(rec, villa);
        el.viewport.appendChild(wv);
        return rec;
      }

      /**
       * All the chrome wiring 4c bound once to its single webview, now bound per POOL MEMBER.
       * Every handler updates its OWN record unconditionally and touches the shared chrome
       * only while it is the active one — that guard is the whole point (section box above).
       */
      function bindPortalListeners(rec, villa) {
        var wv = rec.el;
        function active() { return activePortal === rec; }

        wv.addEventListener('did-start-loading', function () {
          rec.loading = true;
          rec.fail = null;
          if (active()) el.loadingBar.style.width = '70%';
        });

        wv.addEventListener('did-stop-loading', function () {
          rec.loading = false;
          rec.everLoaded = true;
          if (active()) {
            el.loadingBar.style.width = '100%';
            setTimeout(function () {
              // the operator may have switched villas during the 300ms flourish
              if (active() && !rec.loading) el.loadingBar.style.width = '0%';
            }, 300);
            renderPortalChrome();
          }
        });

        wv.addEventListener('dom-ready', function () {
          rec.ready = true;
          // T3-11: a fresh document is a new page appearance — re-arm the auto-insert one-shot so
          // a reload/renavigation to the import form fires again (design contract 3).
          rec.autoInsertFired = false;
          rec.checkinDateFired = false;
          if (active()) renderPortalChrome();
          /**
           * 4e's re-injection hook, per webview (4g): a navigation wiped the injected poller,
           * so put it back — but ONLY when THIS webview's villa is the one still pending.
           * Another villa's background navigation must never trigger an injection of this
           * villa's credentials, and `injectAutofill` itself targets `autofill.wv`, so the
           * pair (this guard + the targeted injection) keeps every credential in its own jar.
           */
          if (autofill.villa === villa) injectAutofill();
        });

        function syncUrl(e) {
          // T3-11: a navigation (full OR SPA in-page route change, e.g. arriving at the real
          // portal's #/external/ifa/import) is a new page appearance — re-arm the one-shot, and
          // drop the banner: it described the page we just left, so it must not hover over the
          // next one. (The auto-insert that follows raises a fresh banner if it succeeds.)
          rec.autoInsertFired = false;
          rec.checkinDateFired = false;
          if (active()) hideInsertBanner();
          if (e.url && e.url !== 'about:blank') {
            rec.url = e.url;
            if (active()) el.urlbox.textContent = rec.url;
          }
        }
        wv.addEventListener('did-navigate', syncUrl);
        wv.addEventListener('did-navigate-in-page', syncUrl);

        wv.addEventListener('did-fail-load', function (e) {
          if (e.errorCode === -3 || !e.isMainFrame) return; // -3 = user-aborted
          rec.loading = false;
          rec.fail = {
            url: e.validatedURL || TM30_URL,
            why: e.errorDescription || 'network error',
          };
          if (active()) renderPortalChrome();
        });
      }

      /**
       * Repaint the SHARED chrome (urlbar, nav buttons, loading bar, portal message) from the
       * ACTIVE record. Called on every switch and by the active webview's own events; it reads
       * only `activePortal`, so a background webview can never paint here even by accident.
       */
      function renderPortalChrome() {
        if (!activePortal) {
          el.urlbox.textContent = TM30_URL;
          el.back.disabled = true;
          el.fwd.disabled = true;
          el.reload.disabled = true;
          el.loadingBar.style.width = '0%';
          el.portalMsg.classList.remove('hidden');
          el.portalMsg.innerHTML =
            '<div class="icon">◌</div>' +
            '<div>Select a villa — its portal session opens here.</div>';
          return;
        }

        var rec = activePortal;
        el.urlbox.textContent = rec.url;
        el.loadingBar.style.width = rec.loading ? '70%' : '0%';

        var canBack = false;
        var canFwd = false;
        if (rec.ready) {
          try {
            canBack = rec.el.canGoBack();
            canFwd = rec.el.canGoForward();
          } catch (e) { /* detached mid-call — treat as not navigable */ }
        }
        el.back.disabled = !canBack;
        el.fwd.disabled = !canFwd;
        el.reload.disabled = !rec.ready;

        if (rec.fail) {
          el.portalMsg.classList.remove('hidden');
          el.portalMsg.innerHTML =
            '<div class="icon">⚠️</div>' +
            '<div>Could not load <b></b></div>' +
            '<div class="hint"></div>';
          el.portalMsg.querySelector('b').textContent = rec.fail.url;
          el.portalMsg.querySelector('.hint').textContent =
            rec.fail.why +
            ' — the portal is reached through your own session; try Reload, or open it by hand.';
        } else if (!rec.everLoaded) {
          el.portalMsg.classList.remove('hidden');
          el.portalMsg.innerHTML =
            '<div class="icon">◌</div>' +
            '<div>Loading the portal…</div>';
        } else {
          el.portalMsg.classList.add('hidden');
        }
      }

      /**
       * Make `villa`'s webview the visible one. Creation is lazy; a SWITCH is a `.hidden`
       * toggle and NOTHING else — no reload, no navigation. The "what 4e deliberately does
       * not do on selection" ruling at the end of the 4e section, per-webview: the `src`
       * attribute loaded the portal ONCE at creation, and selection after that only changes
       * which webview the operator is looking at, preserving each villa's in-page state.
       */
      function showVillaPortal(villa) {
        var next = villa ? ensureWebview(villa) : null;
        if (activePortal === next) {
          renderPortalChrome();
          return;
        }
        if (activePortal) activePortal.el.classList.add('hidden');
        activePortal = next;
        if (next) next.el.classList.remove('hidden');
        renderPortalChrome();
      }

      // ── right pane: chrome buttons + the pool switch ───────────────────────────────────
      // No executeJavaScript here, no autofill (4e), no submit detection (4i). Portal NO-GO,
      // 010 §8: ‹ › ⟳ are the HUMAN's controls over the pane they are looking at.
      function mountPortal() {
        el.back.addEventListener('click', function () {
          if (activePortal && activePortal.el.canGoBack()) activePortal.el.goBack();
        });
        el.fwd.addEventListener('click', function () {
          if (activePortal && activePortal.el.canGoForward()) activePortal.el.goForward();
        });
        el.reload.addEventListener('click', function () {
          if (activePortal) activePortal.el.reload();
        });

        // Q2: the session reset, in the pane it resets. Bound ONCE here rather than rebuilt by
        // `renderSessionBar` — the bar repaints on every selection, and re-adding a listener
        // each time is how one click becomes four.
        el.sbFresh.addEventListener('click', function () {
          if (state.activeVilla) freshLogin(state.activeVilla);
        });

        /**
         * 🔴 This subscription is registered BEFORE `mountAutofill`'s (boot order at the
         * bottom of the file): listeners run in registration order, so by the time 4e's
         * listener handles a selection, the villa's webview EXISTS and is the active one, and
         * `startAutofill` can resolve it. Do not reorder the boot calls.
         */
        onActiveVillaChange(function (ev) {
          showVillaPortal(ev.villa);
        });

        renderPortalChrome();
      }

      /**
       * ↻ fresh login — the per-villa session reset (A-WEB-4g part B).
       *
       * ┌─ 🔴 THE ONE PROGRAMMATIC NAVIGATION IN THIS FILE ──────────────────────────────────┐
       * │ 010 §8 (Portal NO-GO) forbids auto-navigation, and that still stands: SELECTION     │
       * │ never navigates anything. This is the single carve-out — it runs only from an       │
       * │ explicit human click on the ↻ control, and it goes to exactly one place: TM30_URL,  │
       * │ the portal root, so the operator can start a login over without restarting the app. │
       * │ `loadURL()` because the element is attached — `.src` would silently no-op (4c), and │
       * │ `partition` can never change on an attached element anyway.                         │
       * └────────────────────────────────────────────────────────────────────────────────────┘
       *
       * Order (the 4g contract): forget the villa's session CUE → clear the partition's
       * storage in the main process (`persist:tm30-` prefix enforced THERE) → reload the
       * portal root in THAT villa's webview → re-arm exactly as on first selection. A failure
       * at the native step is STATED in the status line and stops the navigation — silently
       * showing a still-logged-in portal after claiming a reset is the one lie this control
       * must not tell. Only THIS villa's `villaSession` entry is touched: the map stays
       * villa-keyed (AMB-1), and the entry is display-only either way (the 🔴 on
       * `state.villaSession` — clearing it revokes a cue, not an authorization).
       *
       * `clearStorageData` + `loadURL` inside the human's own webview are NOT Helper network
       * calls — 014 §2.5 stands untouched.
       */
      function freshLogin(villa) {
        delete state.villaSession[villa];
        renderList();
        renderCount();
        renderStatusLine();
        renderSessionBar(); // the pill is already back to `log in` / `manual login`

        if (!window.tm30Native || !window.tm30Native.resetPortalSession) {
          setStatusNote('fresh login unavailable — the native bridge did not load', 'st-none');
          return;
        }

        var hadWebview = !!portalPool[villa];
        window.tm30Native.resetPortalSession(partitionFor(villa)).then(function (res) {
          if (!res || !res.ok) {
            // 🔴 Loud, not silent (014 §7.9) — and no navigation on top of an uncleaned jar.
            setStatusNote(
              'fresh login failed — ' + ((res && res.error) || 'unknown error'), 'st-none'
            );
            return;
          }

          if (hadWebview) {
            try {
              portalPool[villa].el.loadURL(TM30_URL) // the 4g carve-out — see the box above
                .catch(function () { /* real load failures surface via did-fail-load */ });
            } catch (e) {
              setStatusNote('fresh login failed — could not reload the portal pane', 'st-none');
              return;
            }
          }
          // No webview yet → nothing to reload: the selection below creates it, and its `src`
          // attribute load IS the fresh navigation (4c — attribute before attach).

          if (state.activeVilla !== villa) {
            // Selecting the villa re-runs the whole first-selection flow: the pool switch
            // (mountPortal's listener), then autofill-or-manual (mountAutofill's).
            setActiveVilla(villa);
            return;
          }
          // Already active: `setActiveVilla` would no-op, so re-arm here, exactly as
          // `mountAutofill` does on a first selection.
          var account = accountFor(villa);
          if (account) startAutofill(villa, account);
          else setPortalStatus(null); // manual login — the account slot already says so
        });
      }

      // ═══════════════════════════════════════════════════════════════════════════════════
      // A-WEB-4e — CREDENTIAL AUTOFILL + THE VILLA SESSION (005 §8.1/§8.3, 014 §3; mockup H5)
      //
      // ┌─ 🔴 PORTAL NO-GO — 010 §8, 005 §8.1. THE LINE THIS WHOLE FEATURE IS BUILT AROUND ──┐
      // │                                                                                    │
      // │  The Helper puts the LOGIN and the PASSWORD into two input fields. That is the     │
      // │  entire contract with the portal. It does not:                                     │
      // │                                                                                    │
      // │    · click Log in, or submit any form         · solve, bypass or read Turnstile    │
      // │    · navigate the portal                      · touch the upload page              │
      // │                                                                                    │
      // │  The HUMAN clears Cloudflare, presses Log in, navigates to batch upload, picks the │
      // │  downloaded sheet and submits it. 010 §8's probe is why: the portal 403s a bot even │
      // │  headful, and human-in-the-loop is the ONLY path. The one read we perform is the   │
      // │  `cf-turnstile-response` VALUE — read to know when the field will accept typing,   │
      // │  never to produce or replay a token. It is v1's poller, unchanged.                 │
      // │                                                                                    │
      // │  If you are adding a `.click()`, a `.submit()`, or a `loadURL` in this section, the │
      // │  answer is no.                                                                     │
      // └────────────────────────────────────────────────────────────────────────────────────┘
      //
      // Still ZERO Helper network calls (014 §2.5): this injects script into the page the
      // HUMAN's webview session already loaded. Nothing is fetched.
      // ═══════════════════════════════════════════════════════════════════════════════════

      /** v1's cadences, kept (`window.html:192,209`) — they are field-proven against the portal. */
      var AUTOFILL_POLL_MS = 400;
      var FILLED_WATCH_MS = 600;

      /**
       * The in-flight autofill, or an empty slot. Exactly ONE villa is ever pending: selecting a
       * second villa supersedes the first rather than racing it.
       *
       * 4g: `wv` is the pending villa's OWN pool webview. Every injection, teardown and
       * `__tm30Filled` probe targets THAT element and never "the" portal — there is no single
       * portal any more, and probing the wrong villa's webview would read the wrong document.
       */
      var autofill = { villa: null, login: null, pass: null, token: null, watch: null, wv: null };
      var autofillSeq = 0;

      /** The in-page teardown: kill the poller, blank the fill flag. Shared by both callers. */
      var AUTOFILL_TEARDOWN =
        'if (window.__tm30Autofill) { clearInterval(window.__tm30Autofill); window.__tm30Autofill = null; }' +
        ' window.__tm30Filled = null;';

      /**
       * v1's `buildAutofillScript` (`window.html:163-206`), MIRRORED — the selectors are the
       * portal DOM knowledge v1 earned in production and this ticket must not re-invent:
       *
       *   · `#user` / `#pass`                      the login fields, by id
       *   · `input[name="cf-turnstile-response"]`  Cloudflare's hidden token field; non-empty
       *                                            value ⇒ the human cleared the challenge
       *   · the native `HTMLInputElement.value` setter + input/change/keyup
       *                                            the React-controlled-input workaround, without
       *                                            which the framework overwrites the typed value
       *   · a 400ms poller, because the portal renders Turnstile BEFORE the login form — firing
       *     on load would inject into fields that do not exist yet
       *
       * ⚠️ INTEGRATION ITEM — THE ONE THING THIS TICKET COULD NOT VERIFY (4e, 2026-07-21).
       * A read-only probe of the LIVE portal (no clicking, no solving) found this at t=15s:
       *
       *     url    https://tm30.immigration.go.th/   title "Just a moment..."
       *     inputs exactly ONE — id="cf-chl-widget-8rh6t_response" name="cf-turnstile-response"
       *     #user  absent      #pass absent      forms: none      Ray ID: a1e868290e81f136
       *
       * So the challenge is a **Cloudflare interstitial**, a DIFFERENT document from the login
       * page — and the `cf-turnstile-response` we can see today belongs to the INTERSTITIAL.
       * The poller's condition is an AND across ONE document (`#user` && `#pass` && a non-empty
       * token). It is therefore unproven whether the post-challenge LOGIN page carries a
       * turnstile input of its own. If it does not, `Array.prototype.some` over an EMPTY NodeList
       * returns `false` and **autofill would never fire** — the status would sit on
       * `waiting for captcha…` forever with the fields right there in front of the operator.
       *
       * v1 shipped this exact condition and reportedly worked, which is evidence the login page
       * does carry its own widget — but it is second-hand, the portal has been re-fronted since,
       * and confirming it needs a HUMAN to solve the challenge once. That is a 20-second check at
       * integration and it must be done: click through, then read `#user`/`#pass` and the token
       * count on the page that appears. The logic is deliberately left as v1 wrote it until then
       * (the ticket's "mirror, don't reinvent" constraint) — do not "fix" this on a guess.
       *
       * THE ONE DELTA FROM v1, and why it is required here: v1 was one window per account, so a
       * bare `window.__tm30Filled = true` could never be misread. This window switches villas
       * against ONE long-lived page, where a `true` left behind by villa A is read as villa B's
       * fill the instant B is selected — silently opening a session for a villa whose credentials
       * were never typed. Note this needs NO navigation to happen: a navigation would wipe the
       * flag. It is the portal SPA-routing off the login page that leaves it set.
       *
       * TWO things stop that, and it is worth knowing which does the work:
       *   1. `window.__tm30Filled = null` at the top of this script — the PRIMARY guard. Every
       *      injection resets the flag, so a new villa starts from a clean slate.
       *   2. the per-selection TOKEN, which the watcher below matches exactly — a belt for the
       *      window between the watcher starting and the (async) injection landing, where #1 has
       *      not applied yet and a 600ms tick could still read the stale value.
       * Mutation-tested: removing BOTH fails the harness's stale-flag scenario; removing either
       * alone does not, because each covers the other's main case. Do not delete one on the
       * grounds that the harness stays green.
       */
      function buildAutofillScript(login, pass, token) {
        return `
          (function () {
            if (window.__tm30Autofill) clearInterval(window.__tm30Autofill);
            var LOGIN = ${JSON.stringify(login)};
            var PASS  = ${JSON.stringify(pass)};
            var TOKEN = ${JSON.stringify(token)};

            window.__tm30Filled = null;

            function setVal(el, v) {
              var desc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");
              desc.set.call(el, v);
              el.dispatchEvent(new Event("input",  { bubbles: true }));
              el.dispatchEvent(new Event("change", { bubbles: true }));
              el.dispatchEvent(new Event("keyup",  { bubbles: true }));
            }

            window.__tm30Autofill = setInterval(function () {
              var user = document.getElementById("user");
              var pass = document.getElementById("pass");
              if (!user || !pass) return;

              var tokens = document.querySelectorAll('input[name="cf-turnstile-response"]');
              var solved = Array.prototype.some.call(tokens, function (t) { return t.value && t.value.length > 0; });
              if (!solved) return;

              setVal(user, LOGIN);
              setVal(pass, PASS);
              clearInterval(window.__tm30Autofill);
              window.__tm30Autofill = null;
              window.__tm30Filled = TOKEN;
            }, ${AUTOFILL_POLL_MS});
          })();
        `;
      }

      /** 4e's slot in the status line. `null` clears it. */
      function setPortalStatus(text, cls) {
        state.portalStatus = text ? { text: text, cls: cls } : null;
        renderStatusLine();
      }

      /** Renderer-side only: forget the pending villa and stop polling for its flag. */
      function clearAutofillSlot() {
        if (autofill.watch) {
          clearInterval(autofill.watch);
          autofill.watch = null;
        }
        autofill.villa = null;
        autofill.login = null;
        autofill.pass = null;
        autofill.token = null;
        autofill.wv = null;
      }

      /**
       * Leave the portal with NO villa pending: forget the slot AND kill the in-page poller.
       *
       * The in-page teardown is the part that matters for safety. Without it, deselecting a villa
       * would leave a live poller in the page still holding that villa's password, ready to type
       * it into whatever login form the human navigates to next. Killing the poller is how the
       * credential stops being pending.
       *
       * 🔴 Used ONLY when nothing replaces the pending villa. `startAutofill` deliberately does
       * NOT call this: `executeJavaScript` is async, so a teardown fired just before an injection
       * can land just AFTER it and `clearInterval` the poller it was supposed to precede — the new
       * villa would then wait for a captcha forever. The injected script's own first line already
       * clears its predecessor, so a replacing selection needs the renderer-side clear and nothing
       * more. Ordering is not a thing to rely on here; not depending on it is free.
       */
      function stopAutofill() {
        var wv = autofill.wv; // 4g: the teardown goes to the PENDING villa's webview
        var had = !!autofill.villa;
        clearAutofillSlot();
        if (!had || !wv) return;
        try {
          wv.executeJavaScript(AUTOFILL_TEARDOWN).catch(function () {});
        } catch (e) {
          /* webview not attached — there is no poller to stop */
        }
      }

      /**
       * (Re)inject the pending villa's script into whatever the webview is showing NOW.
       *
       * Called on selection AND on every `dom-ready`, because a navigation wipes the injected
       * poller: the human landing back on the login page after a failed attempt must get the
       * credentials again, not a dead pane. v1 hooked `dom-ready` for the same reason
       * (`window.html:197`) — it just only ever had one page to hook.
       */
      function injectAutofill() {
        if (!autofill.villa || !autofill.wv) return;
        try {
          autofill.wv // 4g: the pending villa's OWN webview, never a shared one
            .executeJavaScript(buildAutofillScript(autofill.login, autofill.pass, autofill.token))
            .catch(function (err) {
              console.warn('[tm30-helper] 4e: autofill injection was rejected', err);
            });
        } catch (e) {
          // Webview not attached yet. `dom-ready` will call us again — that IS the retry.
          console.warn('[tm30-helper] 4e: webview not ready for injection yet');
        }
      }

      /**
       * The human cleared Turnstile and the credentials went in. Open the villa's session.
       *
       * 🔴 Villa-keyed, never group-keyed (AMB-1, 014 §7.2): a villa straddling the 24h boundary
       * is DRAWN in two buckets but is ONE session, and keying this per group box would demand a
       * second Turnstile solve for the same villa — defeating the entire reason the worklist is
       * grouped. The key here is `villa` and there is no group in scope to key it by.
       *
       * No timestamp is stored. 014 §2.1 forbids countdowns, and a stored `at` is the first thing
       * a future ticket renders as "expires in…".
       */
      function openVillaSession(villa, account) {
        state.villaSession[villa] = { login: account.login, via: 'autofill' };
        console.log('[tm30-helper] 4e: session opened for villa "' + villa + '" (autofill landed)');

        // 4a′ PO ruling: English. v1 said `✓ подставлено` (`window.html:204`).
        setPortalStatus('credentials filled ✓', 'st-ok');
        renderList(); // the row's primary action stops being outlined — the villa is unlocked
        renderCount();
        renderSessionBar(); // the pill flips `log in` → `session open`, and the rail turns green
      }

      /**
       * Begin autofilling `villa`. The status goes to `waiting for captcha…` IMMEDIATELY and
       * stays there until the human clears the challenge — that wait is the honest state, and it
       * is the one v1 shipped (`window.html:123`, `ждём капчу…`).
       */
      function startAutofill(villa, account) {
        /**
         * 4g: a superseded villa's poller used to die implicitly — the new injection's first
         * line cleared it, because there was only ONE page. With per-villa webviews the
         * predecessor lives in a DIFFERENT document the new injection never touches, so it
         * would keep polling unwatched and eventually type its own villa's credentials into
         * its own login page with nobody looking. Tear it down explicitly — and ONLY when it
         * really is another webview: a same-webview teardown here would race the new injection
         * (the ordering hazard documented on `stopAutofill`), and same-webview is exactly the
         * case the injected script's own first line already covers.
         */
        var prevWv = autofill.wv;
        clearAutofillSlot(); // NOT stopAutofill — see the ordering note on it

        var rec = ensureWebview(villa); // idempotent — mountPortal's listener normally made it
        if (prevWv && prevWv !== rec.el) {
          try {
            prevWv.executeJavaScript(AUTOFILL_TEARDOWN).catch(function () {});
          } catch (e) { /* not attached — no poller to stop */ }
        }

        autofillSeq += 1;
        var token = 'tm30-fill-' + autofillSeq;
        autofill.villa = villa;
        autofill.login = account.login;
        autofill.pass = account.pass || '';
        autofill.token = token;
        autofill.wv = rec.el;

        setPortalStatus('waiting for captcha…', 'st-none');
        injectAutofill();

        autofill.watch = setInterval(function () {
          if (autofill.token !== token) return; // superseded by a later selection
          var probe;
          try {
            // 4g: probe the pending villa's own webview — token matched, so the slot is ours
            probe = autofill.wv.executeJavaScript('window.__tm30Filled || null');
          } catch (e) {
            return;
          }
          probe
            .then(function (filled) {
              // Both guards matter: the token can be stale (villa switched between the call and
              // its resolution) and the flag can belong to a previous villa's fill.
              if (autofill.token !== token || filled !== token) return;
              clearInterval(autofill.watch);
              autofill.watch = null;
              openVillaSession(villa, account);
            })
            .catch(function () {
              /**
               * The page is mid-navigation, so the probe cannot run. Keep watching rather than
               * giving up (v1 cleared the interval here) — the human bouncing off a failed login
               * back to the form is a NORMAL path, and `dom-ready` will have re-injected by the
               * next tick. The watcher is bounded by selection: switching villas clears it.
               */
            });
        }, FILLED_WATCH_MS);
      }

      /**
       * 🔴 THE SEAM. 4c fires this on every selection change; 4e decides what the portal does.
       *
       * Three outcomes, and the cred-less one is the NORMAL one on day 1 (014 §7.9 — credentials
       * start empty and customers fill villa data later):
       *
       *   account, no session  → autofill, `waiting for captcha…`
       *   account, session     → nothing to do; restore `credentials filled ✓`
       *   NO account           → NOTHING is injected. The portal keeps showing the login page for
       *                          the human to fill in by hand. This is not an error and is never
       *                          rendered as one — the group pill reads `manual login` and the
       *                          status line reads `no credentials — log in manually`.
       */
      function mountAutofill() {
        // 4g: the dom-ready re-injection hook is no longer bound here — it is bound PER pool
        // webview in `bindPortalListeners`, guarded by "this webview's villa === the pending
        // autofill villa", so a background villa's navigation can never trigger an injection.

        onActiveVillaChange(function (ev) {
          if (!ev.villa) {
            stopAutofill();
            setPortalStatus(null);
            return;
          }

          if (!ev.account) {
            // 🔴 Cred-less villa. Deliberately inert. Never errored (014 §7.9).
            stopAutofill();
            setPortalStatus(null);
            console.log(
              '[tm30-helper] 4e: villa "' + ev.villa + '" has no credentials — ' +
                'no autofill; the portal pane stays up for manual login'
            );
            return;
          }

          if (state.villaSession[ev.villa]) {
            stopAutofill();
            setPortalStatus('credentials filled ✓', 'st-ok');
            return;
          }

          console.log(
            '[tm30-helper] 4e: autofilling villa "' + ev.villa + '" as "' + ev.account.login + '" — ' +
              'waiting for the human to clear Turnstile'
          );
          startAutofill(ev.villa, ev.account);
        });
      }

      /**
       * ⚠️ WHAT 4e DELIBERATELY DOES **NOT** DO ON SELECTION: navigate any webview.
       *
       * 014 §3 says "navigate the pane to the portal if needed", but that instruction predates
       * the pane existing. 4g's per-villa pool keeps the ruling, per-webview: a villa's webview
       * loads TM30_URL ONCE, at CREATION, via its `src` ATTRIBUTE (4c's finding — assigning
       * `.src` from script silently no-ops), and every selection after that only toggles which
       * webview is visible. By the time a villa can be re-selected, its portal is loaded.
       *
       * So a selection-time navigation could only ever do one thing: yank the page out from under
       * a human who is mid-Turnstile, mid-upload, or mid-form, because they clicked a row to read
       * it. That is navigation automation, which is exactly what 010 §8 forbids, and it destroys
       * the session that autofill exists to help open. The human drives this pane; ‹ › ⟳ are
       * theirs. We inject into whatever they are looking at, and nothing else.
       *
       * The ONE navigation that exists at all is ↻ fresh login's reload to the portal root —
       * human-click-initiated, never selection-driven. See the carve-out box on `freshLogin`.
       */

      // ═══════════════════════════════════════════════════════════════════════════════════
      // T3-11 — AUTO-INSERT: place the task's sheet into the portal's import form the moment the
      // form appears, so the manager never has to press ⇥ for the ordinary one-task case.
      //
      // ┌─ 🔴 PORTAL NO-GO still holds (010 §8) ─────────────────────────────────────────────┐
      // │ Auto-insert calls the SAME `insertSheet` flow the button does. That flow's ONE DOM   │
      // │ write is the file input's `.files` (T3-08) — it never clicks «Show data from Excel», │
      // │ never Save, never navigates, never touches another control. Auto-insert adds no new  │
      // │ portal write; it only decides WHEN to run the existing one, and shows a banner.      │
      // └────────────────────────────────────────────────────────────────────────────────────┘
      //
      // It mirrors 4e's arming idiom: a per-selection watcher polls the ACTIVE villa's webview
      // (there is no single portal — one webview per villa) for the import form being present AND
      // empty, scoped by a token so a villa switch supersedes rather than races. THREE fail-safes
      // keep it from ever filing the wrong sheet or fighting the human:
      //   · CANDIDATE (never guess): fires only when the target is unambiguous — the focused row
      //     if it is this villa's and sheet-ready, else the villa's SOLE sheet-ready row, else
      //     nothing but a laconic hint to press ⇥ by hand.
      //   · ONE-SHOT: at most once per page appearance per pane. Re-arms only when the form is
      //     seen ABSENT and then present-and-empty again (a reload/renavigation) — a human
      //     clearing or changing the chosen file is NOT a re-trigger. The `autoInsertFired` flag
      //     lives on the pool record so it survives villa switches, and is reset by navigation.
      //   · A loud verify failure does NOT auto-retry: manual ⇥ stays the retry path, unchanged.
      // ═══════════════════════════════════════════════════════════════════════════════════

      // ── MO-TM30-PORTAL-DATE — the Check-in Date fill (ADR-0011) ───────────────────────────
      //
      // ┌─ 🔴 PORTAL NO-GO still holds (010 §8) ─────────────────────────────────────────────┐
      // │ This adds ONE DOM write: the value of the import form's `checkInDate` input. It     │
      // │ never clicks, never submits, never navigates, never opens the datepicker. The date  │
      // │ the operator sees before pressing Save is the one thing that changes.               │
      // └────────────────────────────────────────────────────────────────────────────────────┘
      //
      // Probed live 2026-08-07 on `#/external/ifa/import`:
      //   · `input[formcontrolname="checkInDate"]` — the field. Its `id` is `mat-input-10`, an
      //     Angular Material counter that renumbers with component order, so the id is NOT a
      //     selector anyone should depend on; the form-control name is the stable anchor.
      //   · `informDate` sits beside it carrying `readonly="true"` — the portal owns that one and
      //     we do not touch it. Its default (today) is true by construction.
      //   · Both are pre-filled with TODAY, so "do not overwrite an existing value" cannot mean
      //     "only fill when empty" — the field is never empty. It means: only replace the
      //     portal's own default, never a value a human put there. Hence `EXPECT`.
      var CHECKIN_DATE_SELECTOR = 'input[formcontrolname="checkInDate"]';

      /**
       * Inject the fill. `value` is what to write, `expect` is the portal default we are allowed
       * to replace — anything else in the field means a human has been here and we leave.
       *
       * The write goes through the native value setter and then fires `input`/`change`/`blur`,
       * because the input is an Angular reactive-form control (`mat-datepicker-input`): poking
       * `.value` alone updates the pixels and leaves the form model holding the old date, which
       * is the worst of both worlds — the operator sees the new date and the portal receives the
       * old one. Same technique 4e already uses for the login fields.
       */
      function buildCheckinDateScript(value, expect) {
        return `
          (function () {
            var el = document.querySelector(${JSON.stringify(CHECKIN_DATE_SELECTOR)});
            if (!el) return { ok: false, reason: 'field not found' };
            var before = el.value || '';
            if (before !== ${JSON.stringify(expect)}) return { ok: false, reason: 'not the default', before: before };
            var desc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");
            desc.set.call(el, ${JSON.stringify(value)});
            el.dispatchEvent(new Event("input",  { bubbles: true }));
            el.dispatchEvent(new Event("change", { bubbles: true }));
            el.dispatchEvent(new Event("blur",   { bubbles: true }));
            return { ok: true, before: before, after: el.value || '' };
          })()
        `;
      }

      /**
       * Fill this villa's Check-in Date once, if the rule has anything to say.
       *
       * Silent in three cases, all of them deliberate: an ambiguous target (two sheet-ready rows
       * — the booking decides the date, so guessing the booking would guess the date), a rule
       * verdict of `today` (the portal already shows today; writing it changes nothing), and a
       * verdict of nothing at all (a future or unusable check-in).
       */
      function fireCheckinDateFill(villa) {
        var cand = resolveAutoInsertCandidate(villa);
        if (!cand.row) return;
        var now = Date.now();
        var verdict = window.portalCheckinDate(cand.row.checkin, now);
        if (!verdict.value || verdict.basis === 'today') return;

        var today = window.portalCheckinDate('' + new Date(now).toISOString(), now);
        var rec = portalPool[villa];
        if (!rec || !rec.el) return;
        rec.el
          .executeJavaScript(buildCheckinDateScript(verdict.value, today.value))
          .then(function (res) {
            if (!res || !res.ok) {
              console.log(
                '[tm30-helper] check-in date: not filled (' + ((res && res.reason) || 'no result') + ')'
              );
              return;
            }
            // The substitution is stated, never silent — ADR-0011 makes that a condition of the
            // rule, because the date written can differ from the guest's actual arrival.
            setStatusNote(
              'check-in ' + formatCheckinDay(cand.row.checkin) + ' · filled ' + res.after +
                ' (' + verdict.basis + ')',
              'st-none'
            );
            console.log(
              '[tm30-helper] check-in date: ' + res.before + ' → ' + res.after +
                ' (' + verdict.basis + ', row check-in ' + cand.row.checkin + ')'
            );
          })
          .catch(function () {
            // Mid-navigation — the next page appearance re-arms the one-shot.
          });
      }

      /** ~half a second, in 4e's cadence band (AUTOFILL_POLL_MS 400 / FILLED_WATCH_MS 600). */
      var AUTO_INSERT_POLL_MS = 500;

      /**
       * The in-page probe: is the import form present, and is it EMPTY (no file chosen yet)?
       *
       *   present — a file input exists. On the real portal the uploader lives at the SPA route
       *             `#/external/ifa/import`; if there IS a hash route and it is not that page the
       *             form cannot be here, a cheap pre-filter. The mock has no hash, so an empty
       *             hash never blocks and form presence alone decides (as the design requires).
       *   empty   — the input holds no File, AND the page shows no chosen FILENAME. A consuming
       *             uploader (the real portal, and the mock's default) clears the input on change
       *             and echoes the name into its own display box, so `input.files` empties through
       *             no fault of ours; the filename echo is what says "a file is already chosen".
       *             The always-present static hint text mentions a bare ".xlsx" with no name in
       *             front of the dot — a filename-SHAPED token (a name char immediately before
       *             ".xlsx") is what distinguishes a real chosen file from that hint, so the hint
       *             never reads as "not empty" and the form never looks perpetually occupied.
       */
      var AUTO_INSERT_PROBE = `
        (function () {
          var hash = location.hash || '';
          if (hash && hash.indexOf('/external/ifa/import') < 0) return { present: false, empty: false };
          var input = document.querySelector('input[type="file"]');
          if (!input) return { present: false, empty: false };
          if (input.files && input.files.length > 0) return { present: true, empty: false };
          var txt = ((document.body && document.body.innerText) || '').toLowerCase();
          var idx = txt.indexOf('.xlsx');
          var hasName = false;
          while (idx > 0) {
            var c = txt.charAt(idx - 1);
            if ((c >= 'a' && c <= 'z') || (c >= '0' && c <= '9') || c === '_' || c === '-') { hasName = true; break; }
            idx = txt.indexOf('.xlsx', idx + 1);
          }
          return { present: true, empty: !hasName };
        })()
      `;

      /**
       * Which row auto-insert would file for `villa`, or none. The fail-safe from the design,
       * verbatim: (a) the focused row if it is THIS villa's and sheet-ready with a url; else
       * (b) the villa's SOLE sheet-ready-with-url row; else none (ambiguous or nothing to file).
       * Never a guess between two eligible rows.
       */
      function resolveAutoInsertCandidate(villa) {
        var ready = state.worklist.filter(function (r) {
          return r.villa === villa && r.status === 'sheet_ready' && r.sheet_download_url;
        });
        if (state.focusFilingId !== null && state.focusFilingId !== undefined) {
          for (var i = 0; i < ready.length; i += 1) {
            if (ready[i].filing_id === state.focusFilingId) return { row: ready[i], reason: 'focus' };
          }
        }
        if (ready.length === 1) return { row: ready[0], reason: 'sole' };
        return { row: null, reason: ready.length === 0 ? 'none' : 'ambiguous', count: ready.length };
      }

      /** The active-villa auto-insert watcher, or an empty slot (mirrors `autofill`). */
      var autoInsert = { villa: null, wv: null, watch: null, token: null };
      var autoInsertSeq = 0;

      /** Forget the pending villa and stop polling (renderer-side only — no in-page teardown). */
      function stopAutoInsertWatch() {
        if (autoInsert.watch) {
          clearInterval(autoInsert.watch);
          autoInsert.watch = null;
        }
        autoInsert.villa = null;
        autoInsert.wv = null;
        autoInsert.token = null;
      }

      /**
       * The one shot for `villa` at this page appearance. Called by the watcher when the import
       * form is present, empty, not-yet-fired and no other insert is in flight — and it consumes
       * the one-shot before this, so an ambiguous target still steps aside for exactly one page
       * appearance rather than re-hinting every tick.
       */
      function fireAutoInsert(villa) {
        var cand = resolveAutoInsertCandidate(villa);
        if (!cand.row) {
          // Ambiguous or nothing eligible: never guess. Point the human at manual ⇥, laconically.
          setStatusNote('select a task and press ⇥ insert', 'st-none');
          console.log(
            '[tm30-helper] T3-11: import form ready for "' + villa + '" but the target is ' +
              cand.reason + ' — no auto-insert; manual ⇥ stays available'
          );
          return;
        }
        var btn = el.list.querySelector(
          '.row[data-filing-id="' + cand.row.filing_id + '"] .act-insert'
        );
        console.log(
          '[tm30-helper] T3-11: auto-inserting filing ' + cand.row.filing_id +
            ' (' + cand.reason + ') into "' + villa + '"'
        );
        insertSheet(cand.row, btn, { auto: true }); // the SAME flow the button runs
      }

      /**
       * Arm auto-insert for `villa`'s webview: supersede any previous watcher, then poll THIS
       * webview for the present-and-empty import form. The `autoInsertFired` flag lives on the
       * pool record (survives villa switches — the one-shot is per PAGE, not per selection); the
       * watcher resets it whenever the form is seen ABSENT, and navigation resets it too.
       */
      function armAutoInsert(villa) {
        stopAutoInsertWatch();
        if (!villa) return;
        var rec = ensureWebview(villa);
        autoInsertSeq += 1;
        var token = 'tm30-autoins-' + autoInsertSeq;
        autoInsert.villa = villa;
        autoInsert.wv = rec.el;
        autoInsert.token = token;

        autoInsert.watch = setInterval(function () {
          if (autoInsert.token !== token) return; // superseded by a later selection
          var probe;
          try {
            probe = autoInsert.wv.executeJavaScript(AUTO_INSERT_PROBE);
          } catch (e) {
            return; // webview not attached — try next tick
          }
          probe
            .then(function (p) {
              if (autoInsert.token !== token) return;
              var r = portalPool[villa];
              if (!r) return;
              if (!p || !p.present) {
                r.autoInsertFired = false; // form gone → re-arm for its next appearance
                r.checkinDateFired = false;
                return;
              }
              // The date rides the same tick and the same page-appearance one-shot, but its OWN
              // flag: it must still fill when the file insert declines (ambiguous target, an
              // insert already running), and it must not re-fire when the human clears the file.
              if (!r.checkinDateFired) {
                r.checkinDateFired = true;
                fireCheckinDateFill(villa);
              }
              if (r.autoInsertFired) return; // already fired for this appearance (one-shot)
              if (!p.empty) return; // the human already chose a file — never fight them
              if (state.insertBusy !== null) return; // an insert is running — do not consume yet
              r.autoInsertFired = true; // consume the one-shot BEFORE firing (any verdict)
              fireAutoInsert(villa);
            })
            .catch(function () {
              // Mid-navigation probe rejected — keep watching; the next tick reads the new page.
            });
        }, AUTO_INSERT_POLL_MS);
      }

      /**
       * 4c fires `onActiveVillaChange` on every selection; auto-insert re-arms on the new villa
       * and drops the banner (it belongs to the pane you were looking at, never the next one).
       * Registered AFTER `mountPortal`'s subscription so the villa's webview already exists.
       */
      function mountAutoInsert() {
        onActiveVillaChange(function (ev) {
          hideInsertBanner();
          armAutoInsert(ev.villa);
        });
      }

      // ── boot ───────────────────────────────────────────────────────────────────────────
      var payload = readPayload();
      state.worklist = Array.isArray(payload.worklist) ? payload.worklist : [];

      /**
       * T3-03: resolve the optional focus BEFORE the first render, so the highlight is on the
       * very first paint and a postponed focused row is not hidden inside the collapsed group.
       * An id that is not in THIS payload's worklist is dropped with a log — stale focus must
       * not highlight nothing or, worse, a wrong row.
       */
      var focusRow = null;
      if (Number.isFinite(payload.focus_filing_id)) {
        for (var fi = 0; fi < state.worklist.length; fi += 1) {
          if (state.worklist[fi].filing_id === payload.focus_filing_id) {
            focusRow = state.worklist[fi];
            break;
          }
        }
        if (focusRow) {
          state.focusFilingId = payload.focus_filing_id;
          if (!state.renderNow) state.renderNow = Date.now(); // the same captured instant renderList would take
          // A postponed focus row used to need the collapsed group expanded before it could be
          // seen. The list is flat now, so every row is already on screen and there is nothing
          // left to open — `.row.focused` and the scroll-into-view below do the rest.
        } else {
          console.warn(
            '[tm30-helper] focus_filing_id ' + payload.focus_filing_id +
              ' is not in this worklist — opening unfocused'
          );
        }
      }

      renderList();
      renderCount(); // reads `state.worklist` directly — no ordering dependency on renderList
      renderStatusLine();
      // 🔴 4g: mountPortal BEFORE mountAutofill — their `onActiveVillaChange` subscriptions run
      // in registration order, and 4e's must find the villa's pool webview already created and
      // active. See the note inside `mountPortal`.
      mountPortal();
      mountAutofill(); // 4e — subscribes to `onActiveVillaChange`; nothing fires until a click
      // T3-11: subscribe AFTER mountPortal so the villa's webview already exists when a selection
      // arms the watcher. Independent of 4e (login vs. upload-form arming) — order between them
      // does not matter. The banner dismiss-on-click is bound here, once.
      mountAutoInsert();
      el.insertBanner.addEventListener('click', hideInsertBanner);

      /**
       * T3-03: the one-time INITIAL-BOOT auto-select — deliberately the SAME call a human villa
       * click makes, and nothing more: `setActiveVilla` → mountPortal's listener boots the
       * villa's `persist:tm30-v-…` webview from the pool → mountAutofill's listener arms the
       * credential autofill (or stays inert for a cred-less villa). It runs AFTER both mounts,
       * exactly like a click would.
       *
       * This can never navigate or reset an already-open window: every v2 deep link opens a
       * NEW window (main.js `openWorklistWindow`), so this code only ever runs against a
       * freshly-booted, empty pool — the selection-must-not-navigate ruling holds untouched
       * for everything after this line.
       */
      if (focusRow) {
        setActiveVilla(focusRow.villa);
        var focusedEl = el.list.querySelector('.row.focused');
        if (focusedEl && focusedEl.scrollIntoView) focusedEl.scrollIntoView({ block: 'nearest' });
      }

      console.log(
        '[tm30-helper] app.html: two-pane shell up — ' +
          state.worklist.length + ' filing(s), ' +
          state.worklist.filter(function (r) { return r.account; }).length + ' with credentials'
      );

      /**
       * The seam 4d/4e/4f build against. Everything they need to reach is here and nowhere else.
       */
      window.tm30Shell = {
        state: state,
        setActiveVilla: setActiveVilla,
        onActiveVillaChange: onActiveVillaChange,
        accountFor: accountFor,
        renderList: renderList,
        renderStatusLine: renderStatusLine,
        /** 4d's status-line slot (right-hand side). `null` clears. */
        setStatusNote: setStatusNote,
        /**
         * 4g: the ACTIVE villa's webview — a getter, because there is one webview per villa
         * now and "the portal" means whichever one the operator is looking at. Null before the
         * first selection. The autofill harness and future tickets build against this seam.
         */
        get portal() { return activePortal ? activePortal.el : null; },

        // ── 4g ──────────────────────────────────────────────────────────────────────────
        /** The deterministic per-villa partition: `persist:tm30-v-<encodeURIComponent>`. */
        partitionFor: partitionFor,
        /** The ↻ handler — human-click-initiated per-villa session reset. */
        freshLogin: freshLogin,

        // ── 4e ──────────────────────────────────────────────────────────────────────────
        /** Has credentials, has no session. A cred-less villa is NEVER locked. */
        isLocked: isLocked,
        /** The captcha-wait slot. Exposed so a harness can read the transitions. */
        setPortalStatus: setPortalStatus,
        /** The exact script injected into the portal — asserted verbatim by the 4e harness. */
        buildAutofillScript: buildAutofillScript,
        /** The in-flight autofill slot (villa/login/token), for inspection. */
        autofill: autofill,

        // ── 4f ──────────────────────────────────────────────────────────────────────────
        /** The hand-back: opens `row.return_url` in the DEFAULT browser (005 §8.4). */
        markSubmitted: markSubmitted,
        /** Whether a row carries a usable `return_url` at all (014 §7.9). */
        canHandBack: canHandBack,

        // ── T3-11 ─────────────────────────────────────────────────────────────────────
        /** Which row auto-insert would file for a villa (or none) — asserted by the harness. */
        resolveAutoInsertCandidate: resolveAutoInsertCandidate,
        /** The in-flight auto-insert watcher slot (villa/token), for inspection. */
        autoInsert: autoInsert,
        /** Drop the auto-insert banner (used by the harness to reset between scenarios). */
        hideInsertBanner: hideInsertBanner,
      };
    </script>
  </body>
</html>
