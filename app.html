<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TM30 Helper</title>
    <!--
      A-WEB-4c — THE TWO-PANE WINDOW SHELL (014 §2.4, §3; mockup H1).
      A-WEB-4d — the LEFT PANE's grouped worklist (014 §7.2; mockup H2 + H4). 4d replaced
                 `renderList()`, the single seam 4c left for it, and added the ⬇ download +
                 📁 folder actions through `preload.js`. Nothing else in the shell moved.
      A-WEB-4e — the RIGHT PANE's credential AUTOFILL, the captcha-wait status, and the
                 villa session that unlocks a group (014 §3, §7.9; 005 §8.1/§8.3; mockup H5 + H8).
                 4e is the ONLY code that calls `webview.executeJavaScript`, and it injects
                 exactly one thing: the login + password, into the fields, once the HUMAN has
                 cleared Turnstile. See the PORTAL NO-GO box in the 4e section below.
      A-WEB-4g — PER-VILLA PORTAL SESSIONS. The single shared `<webview>` became a POOL: one
                 webview per villa, each on its own `persist:tm30-v-…` partition (own cookie
                 jar), created lazily on first selection and toggled with `.hidden` after that.
                 Plus ↻ fresh login — the human-initiated per-villa session reset, and the ONE
                 programmatic navigation this file is allowed (see the carve-out on
                 `freshLogin`). The 4e autofill now targets the pending villa's OWN webview.

      One window, two panes. This replaces v1's two-window model FOR THE v2 PATH ONLY: the v1
      windows (`index.html` chooser, `window.html` per-account portal) are untouched and still
      open for v1 links (013 §3.5 — backward-compat is mandatory).

      ── What this file IS ───────────────────────────────────────────────────────────────────
      The CONTAINER, matched to the signed-off mockup: a 360px worklist pane on the left, the
      portal `<webview>` pane on the right, a urlbar above it and a status line below it.

      ── What this file deliberately is NOT ──────────────────────────────────────────────────
      · 4i — portal submit detection. Not accepted into iteration 1 (orchestrator 2026-07-17).
      · a recorder of `submitted`. 4f hands `return_url` to the browser and the WEB records it via
        endpoint #9 (005 §8.4). The Helper never learns the outcome — see `markSubmitted`.

      ── Constraints this file is built under ────────────────────────────────────────────────
      · ZERO Helper network calls (014 §2.5). Everything rendered comes out of the deep-link
        payload, which main.js already parsed and passed in as `?d=<base64url(JSON)>`. The
        `<webview>` navigating to the portal is the HUMAN's browser session, not a Helper fetch.
      · Portal NO-GO (010 §8). No DOM automation, no auto-submit, no captcha interaction.
      · NO credentials is the NORMAL state (creds start empty, PO 2026-07-20). The window must
        render fine without `account`, and the right pane still shows the portal for manual
        login. Nothing here is gated on `account` being present.
      · English only (4a′ PO ruling). No Russian strings.
      · A session belongs to the VILLA, not to the group box it is drawn in (014 §7.2 AMB-1) —
        hence `state.villaSession` is keyed by villa, and 4d must not re-key it per group.
    -->
    <style>
      /*
       * Palette re-based onto mo-reservation-fe so the Helper and the dashboard read as one
       * product. Three things changed, and only these:
       *
       *  • The neutral ramp is Tailwind `slate`, the same one the web app settled on. The old
       *    ramp was a bespoke blue-grey (#0f1519 / #5a6673 / #d3dae2) — close enough to slate to
       *    look like a slightly dirty version of it when the two windows sit side by side.
       *  • The status colours are the web app's badge severities, hex for hex, so "overdue" is
       *    the same red here as on the reservation row that sent you here.
       *  • The accent is MO gold — what the dashboard uses to mark the thing you are on. It is
       *    a MARK, not a fill: gold under white text fails contrast, so solid buttons take
       *    `--primary` and gold text on a gold wash takes the darker `--accent-ink`.
       *
       * The dark-mode block is gone. The web app ships light only, and "matches the site" and
       * "follows the OS" cannot both be true.
       */
      :root {
        --paper: #f8fafc; --surface: #ffffff; --surface-2: #f8fafc;
        --ink: #0f172a; --muted: #64748b; --faint: #94a3b8;
        --line: #e2e8f0; --line-soft: #f1f5f9;

        --accent: #bd9c69; --accent-soft: #faf6ef; --accent-ink: #8a6d3f;
        --primary: #1e2530;

        --due: #92400e; --due-bg: #fffbeb;
        --overdue: #b91c1c; --overdue-bg: #fef2f2;
        --ok: #166534; --ok-bg: #f0fdf4;
        --blocked: #475569; --blocked-bg: #f1f5f9;

        /*
         * The system stack, deliberately. The web app's Inter and JetBrains Mono are not
         * shipped with this app, so naming them here bought nothing: every operator machine
         * fell through to the next entry anyway, and the declaration only made the stylesheet
         * claim a match with the dashboard that the pixels never delivered. Bundling both faces
         * to close a gap this size is not worth ~300 KB in an auto-updating Electron build.
         */
        --ui: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: var(--ui);
        font-size: 14px;
        color: var(--ink);
        background: var(--paper);
      }

      /* ── the two panes (mockup H1: grid 360px 1fr) ───────────────────────────────────── */
      .panes {
        display: grid;
        grid-template-columns: 360px 1fr;
        height: 100%;
      }
      .pane-l {
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        background: var(--surface);
        min-height: 0;
      }
      .pane-r {
        display: flex;
        flex-direction: column;
        background: var(--surface-2);
        min-width: 0;
        min-height: 0;
      }

      .pane-head {
        padding: 11px 14px;
        border-bottom: 1px solid var(--line-soft);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex: 0 0 auto;
      }
      .pane-head h3 { margin: 0; font-size: 13px; font-weight: 650; letter-spacing: 0.02em; }
      .pane-head .count { font-size: 11px; color: var(--faint); font-family: var(--mono); }

      .list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 8px 12px;
        display: flex;
        flex-direction: column;
        gap: 0;
        min-height: 0;
      }

      /*
        🔴 `.list` is a COLUMN FLEX container, so its children default to `flex-shrink: 1` and
        get SQUASHED once the worklist is taller than the pane — rows lose their action bar and
        whole rows vanish below the fold, instead of the list scrolling. Observed while building
        4d with a 9-row fixture, and it applies to a flat list exactly as it did to groups. Every
        list child is therefore pinned to its natural height; `.list`'s `overflow-y: auto` then
        does what it was always meant to.
      */
      .list > * { flex: 0 0 auto; }

      /* ── worklist row (mockup H2 — row art lifted verbatim) ──────────────────────────── */
      /*
        A list item, not a card. This was an outlined, rounded box nested inside another
        outlined, rounded box (the villa group) whose buttons were themselves outlined boxes —
        three levels of framing inside a 360px pane. What survives is the one mark that carries
        meaning: the coloured edge bar. Rows are told apart by a hairline, the way the web app's
        agenda tells its bookings apart.
      */
      .row {
        border-left: 3px solid var(--blocked);
        border-bottom: 1px solid var(--line-soft);
        padding: 9px 10px 9px 11px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        position: relative;
        cursor: pointer;
        transition: background 0.12s;
        text-align: left;
        font: inherit;
        color: inherit;
      }
      .row:last-child { border-bottom: 0; }
      .row:hover { background: rgba(15, 23, 42, 0.03); }
      .row.sel { background: var(--accent-soft); }
      /*
        T3-03: the deep link's FOCUSED filing — the one the operator launched from. An outer
        ring, distinct from `.sel`'s inset (selection is per-VILLA and moves with clicks; the
        focus is per-ROW and never moves), so the two can overlap without erasing each other.
      */
      .row.focused { outline: 2px solid var(--accent); outline-offset: 1px; }
      .row.s-need { border-left-color: var(--due); }
      .row.s-dl { border-left-color: var(--accent); }
      .row.s-sub { border-left-color: var(--ok); }
      .row.s-over { border-left-color: var(--overdue); }
      .row.s-block { border-left-color: var(--blocked); opacity: 0.75; }
      .row.s-await { border-left-color: var(--ok); border-left-style: dashed; }

      .row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      /*
        The check-in date IS the row's name now — the villa is printed once, on the group header
        that owns these rows, instead of once per row underneath it. Not monospaced: a date is
        read, not aligned into a column, and mono here made it the only typewriter text on a
        pane of proportional type.
      */
      .when { font-size: 12px; color: var(--ink); display: flex; align-items: baseline; gap: 5px; margin-top: 1px; }
      .when-sep { color: var(--faint); }
      .when-out { color: var(--muted); }
      .when .due { color: var(--due); font-weight: 600; }

      .badge {
        flex: none;
        font-size: 11px;
        font-weight: 500;
        padding: 2px 6px;
        border-radius: 4px;
        white-space: nowrap;
        background: var(--blocked-bg);
        color: var(--blocked);
      }
      .badge.b-need { background: var(--due-bg); color: var(--due); }
      .badge.b-dl { background: var(--accent-soft); color: var(--accent-ink); }
      .badge.b-sub { background: var(--ok-bg); color: var(--ok); }
      .badge.b-over { background: var(--overdue-bg); color: var(--overdue); }
      .badge.b-block { background: var(--blocked-bg); color: var(--blocked); }
      .badge.b-await { background: transparent; color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }

      /*
        Row action bar — ONE fixed slot order for every state: status · insert · xlsx · folder.
        Markup is authored in that order too, so tab order matches what you see; the `order`
        values are a guard, not the mechanism. Slots are always PRESENT: they disable, they
        never disappear, so nothing shifts position as a row changes state (mockup H2).
      */
      /* One line, never two: the folder button used to wrap onto a row of its own and sit
         there stranded under a run of empty space. */
      /*
        One line, in priority order, and only the primary carries a word.
        Six labelled controls do not fit 360px — the last of them lost its text and then its
        right edge. What is left is the action that finishes the filing, written out, and the
        one control that supports it, as its icon and named by `title`. The session chip that
        used to close this row now lives in the portal pane (`.sessionbar`): it is a
        precondition, it is per-VILLA, and repeating it on every filing that villa owns said
        the same thing three times.
      */
      .acts { display: flex; gap: 5px; flex-wrap: nowrap; align-items: center; order: 2; }
      .act-status { order: 1; margin-right: auto; }
      .act-insert { order: 2; }
      .act-folder { order: 3; }

      /* Villa and date on one line: the name leads, the date qualifies it. */
      .row-id { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
      .villa { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
      .ref { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; }
      /*
        Priority is now visible in the weight, not just the order. The primary action was an
        outlined button identical to the two secondaries beside it, so nothing said which one
        finishes the job; the secondaries carried the same frame as the thing they support.
      */
      /*
        Three weights, and every one of them still looks like a button.
        The previous pass made all of them ghosts — no border, no fill — so the action that
        finishes a filing was indistinguishable from the text beside it, and on a row whose
        villa is not logged in it lost even its fill and read as disabled.
      */
      .btn {
        font: inherit;
        font-size: 11.5px;
        font-weight: 500;
        padding: 5px 9px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
        transition: 0.12s;
      }
      .btn svg { flex: none; opacity: 0.75; }
      .btn:hover:not([disabled]) { border-color: var(--faint); background: var(--surface-2); }
      .btn[disabled] { opacity: 0.45; cursor: not-allowed; }

      /* The one that completes the filing. Filled — nothing else on the row is. */
      .btn.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
        font-weight: 550;
      }
      .btn.primary svg { opacity: 1; }
      .btn.primary:hover:not([disabled]) { filter: brightness(1.15); color: #fff; }
      /*
        Not yet inviting, still obviously pressable: the villa has no portal session, so filing
        has not happened yet. It used to drop to a bare ghost here, which read as broken.
      */
      .btn.primary.locked {
        background: var(--surface);
        border-color: var(--ink);
        color: var(--ink);
      }
      .btn.done { background: var(--ok-bg); border-color: transparent; color: var(--ok); cursor: default; }
      .btn.icon-only { padding: 5px; }
      /* Not italic — it was the only slanted type here, and italic in a dense list reads as an
         error rather than as an explanation. */
      .rowmsg { font-size: 11px; color: var(--muted); order: 1; }

      /*
        ── session bar (Q2) — the active villa's portal session, in the portal pane ────────
        Carries the three things the villa group header used to: WHO is logged in, WHETHER the
        session is open, and the way to start it over. The colour language is the group's,
        unchanged — amber waiting, green open, grey manual — so nothing has to be re-learned.

        The left border is the same state rail `.vgroup-h` drew, kept because it is the one
        mark readable without reading: the pane's top edge changes colour when a captcha is
        solved.
      */
      .sessionbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 12px;
        background: var(--surface-2);
        border-bottom: 1px solid var(--line);
        border-left: 3px solid var(--due);
        flex: 0 0 auto;
      }
      .sessionbar.open-session { border-left-color: var(--ok); }
      .sessionbar.no-acct { border-left-color: var(--blocked); }
      .sb-id { min-width: 0; flex: 1; }
      .sb-villa { font-size: 12.5px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.25; }
      .sb-acct {
        font-size: 10.5px;
        font-family: var(--mono);
        color: var(--muted);
        margin-top: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sb-acct.none { font-family: var(--ui); color: var(--faint); }
      .sb-pill {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 10.5px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 5px;
        white-space: nowrap;
      }
      .sb-pill svg { flex: none; }
      .sb-pill.locked { background: var(--due-bg); color: var(--due); }
      .sb-pill.open { background: var(--ok-bg); color: var(--ok); }
      .sb-pill.manual { background: var(--blocked-bg); color: var(--blocked); }
      .sb-fresh {
        flex: none;
        font: inherit;
        font-size: 11px;
        font-weight: 500;
        padding: 4px 9px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--muted);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
        transition: 0.12s;
      }
      .sb-fresh svg { flex: none; opacity: 0.75; }
      .sb-fresh:hover { border-color: var(--faint); color: var(--ink); }

      .st-ok { color: var(--ok); font-weight: 600; }

      .empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 34px 20px;
        text-align: center;
      }
      .empty .big { font-size: 13.5px; font-weight: 640; }
      .empty .sm { font-size: 11.5px; color: var(--muted); max-width: 30ch; line-height: 1.5; }

      /* ── right pane: urlbar · webview · status line ───────────────────────────────────── */
      .urlbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 11px;
        background: var(--surface);
        border-bottom: 1px solid var(--line-soft);
        flex: 0 0 auto;
      }
      .urlbar button {
        border: none;
        background: transparent;
        color: var(--faint);
        font-size: 14px;
        cursor: pointer;
        width: 24px;
        height: 24px;
        border-radius: 5px;
      }
      .urlbar button:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
      .urlbar button:disabled { opacity: 0.35; cursor: default; }
      .urlbox {
        flex: 1;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        background: var(--surface-2);
        border: 1px solid var(--line-soft);
        border-radius: 5px;
        padding: 4px 9px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .viewport { flex: 1; position: relative; min-height: 0; }
      webview { position: absolute; inset: 0; width: 100%; height: 100%; display: flex; }
      .portal-msg {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 22px;
        text-align: center;
        background: var(--surface-2);
        color: var(--muted);
        font-size: 12px;
        z-index: 2;
      }
      .portal-msg .icon { font-size: 30px; }
      .portal-msg .hint { font-size: 11px; color: var(--faint); max-width: 46ch; line-height: 1.5; }
      .hidden { display: none !important; }
      .loading-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 3px;
        width: 0%;
        background: var(--accent);
        transition: width 0.4s ease;
        z-index: 3;
      }

      /*
        T3-11 — the AUTO-INSERT notification. Helper chrome overlaid at the top edge of the
        portal pane, NEVER injected into the portal page (010 §8): the auto-insert placed a
        sheet the human did not pick by hand, so it must be VISIBLE that it happened. Filled
        green (success), click to dismiss, self-hides after ~15s. Only shown on a successful
        auto-insert; a loud verification failure gets the status line's do-NOT-submit, no banner.
      */
      .insert-banner {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 28px);
        z-index: 4;
        padding: 9px 14px;
        border-radius: 7px;
        background: var(--ok);
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .statusline {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 13px;
        border-top: 1px solid var(--line);
        background: var(--surface-2);
        font-size: 11.5px;
        color: var(--muted);
        flex-wrap: wrap;
        flex: 0 0 auto;
      }
      .statusline .sep { color: var(--line); user-select: none; }
      .statusline .spacer { flex: 1; }
      .st-acct { font-weight: 600; color: var(--ink); }
      .st-none { color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="panes">
      <!-- LEFT — the worklist container. 4d fills this with villa groups. -->
      <section class="pane-l" aria-label="Worklist">
        <div class="pane-head">
          <h3>to do</h3>
          <span class="count" id="count">—</span>
        </div>
        <div class="list" id="list"></div>
      </section>

      <!-- RIGHT — the portal pane. Real webview; the human drives it. -->
      <section class="pane-r" aria-label="TM30 portal">
        <div class="urlbar">
          <button id="btn-back" title="Back" disabled>‹</button>
          <button id="btn-fwd" title="Forward" disabled>›</button>
          <button id="btn-reload" title="Reload" disabled>⟳</button>
          <span class="urlbox" id="urlbox"></span>
        </div>
        <!--
          ── the ACTIVE villa's portal session (Q2) ────────────────────────────────────────
          The session moved here when the worklist went flat. It used to live in the villa
          group header, and when grouping was replaced by a priority sort that header — and
          with it the session chip and `↻ fresh login` — had nowhere left to render, leaving
          `freshLogin()` reachable only from the console.

          This is the better home regardless: a portal session is a property of the PANE, not
          of the queue. There is exactly one active villa, so the state is stated once instead
          of repeating on every filing that villa owns, and the reset sits beside the thing it
          resets. Hidden entirely until a villa is selected — an empty pane has no session.
        -->
        <div class="sessionbar hidden" id="sessionbar">
          <div class="sb-id">
            <div class="sb-villa" id="sb-villa"></div>
            <div class="sb-acct" id="sb-acct"></div>
          </div>
          <span class="sb-pill" id="sb-pill"></span>
          <button type="button" class="sb-fresh" id="sb-fresh"></button>
        </div>
        <div class="viewport" id="viewport">
          <div class="loading-bar" id="loading-bar"></div>
          <!--
            A-WEB-4g: no static <webview> here any more. Each villa gets its OWN webview — its
            own `persist:` partition, its own cookie jar — created lazily on the villa's first
            selection (`ensureWebview`) and appended into this viewport. 4c's race finding still
            binds every one of them: `src` and `partition` go on as ATTRIBUTES before the element
            is appended, because assigning `webview.src` from script races the attachment and the
            navigation is silently dropped — the webview just sits on about:blank with no
            did-fail-load to tell you (verified while building 4c) — and `partition` is IMMUTABLE
            once the element is attached. Switching villas toggles `.hidden` and nothing else.
          -->
          <div class="portal-msg" id="portal-msg">
            <div class="icon">◌</div>
            <div>Select a villa — its portal session opens here.</div>
          </div>
          <!--
            T3-11: the auto-insert banner. Helper chrome (NOT injected into the portal page),
            shown only after the Helper auto-placed a sheet into the import form. Click dismisses.
          -->
          <div class="insert-banner hidden" id="insert-banner"></div>
        </div>
        <div class="statusline" id="statusline"></div>
      </section>
    </div>

    <!-- The Check-in Date rule (ADR-0011). A plain browser script, not a module: this document
         has no node integration. The same file is `require`d by `test/portal-dates.test.mjs`. -->
    <script src="portal-dates.js"></script>
    <script>
      'use strict';

      /**
       * 4g: with the per-villa webview pool there is no static <webview> to read this off, so
       * the portal root lives here — and is stamped onto every pool webview as its `src`
       * ATTRIBUTE at creation, which is what actually navigates it (4c's ruling: `.src` from
       * script silently no-ops; the attribute, set before attach, is the mechanism).
       *
       * T3-07: the ONE override seam for the internal mock-portal e2e. This renderer has no
       * process.env, so main.js forwards TM30_PORTAL_BASE_URL as `?portal=…` over the same
       * zero-dep query mechanism the payload rides. No param (env unset, and every existing
       * harness boot) ⇒ the real portal — behavior byte-identical.
       */
      var TM30_URL =
        new URLSearchParams(location.search).get('portal') ||
        'https://tm30.immigration.go.th';

      // ── payload ────────────────────────────────────────────────────────────────────────
      // Same zero-dep mechanism v1 uses: main.js base64url-encodes the ALREADY-PARSED payload
      // into the file query. No preload, no IPC, no fetch. main.js has already validated it and
      // shown a native error box for anything broken, so this window only ever sees a good one.
      function readPayload() {
        var d = new URLSearchParams(location.search).get('d');
        if (!d) return { v: 2, worklist: [] };
        try {
          var b64 = d.replace(/-/g, '+').replace(/_/g, '/');
          var bytes = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
          return JSON.parse(new TextDecoder().decode(bytes));
        } catch (e) {
          console.error('[tm30-helper] app.html could not read its payload', e);
          return { v: 2, worklist: [] };
        }
      }

      /**
       * The shell's whole state. Deliberately small.
       *
       * `villaSession` is keyed by VILLA and never by group box — 014 §7.2 AMB-1: a villa that
       * straddles the 24h boundary is drawn in two buckets but is ONE session, and keying it per
       * box would cost two Turnstile solves and defeat the reason grouping exists. 4c only stands
       * the map up; 4e writes to it when a login lands.
       *
       * 🔴 4e — WHAT A `villaSession` ENTRY ACTUALLY ASSERTS. Read this before trusting it.
       * It means: "for this villa, the human cleared Turnstile and we put the credentials in the
       * fields." It does NOT mean "this villa is logged in" — the Helper never sees the login
       * response. Observing that would be portal submit detection (4i), which is NOT in
       * iteration 1. Everything downstream must treat it as a CUE, never as an authorization.
       */
      var state = {
        worklist: [],
        activeVilla: null,
        villaSession: Object.create(null),

        // ── A-WEB-4d additions ──────────────────────────────────────────────────────────
        /**
         * Helper-LOCAL row facts, keyed by `filing_id`. These are NOT backend statuses and are
         * never sent anywhere (mockup H2 GAP-B: "downloaded is Helper-local and must not be
         * sent to a backend status"). `{ downloadPath, downloadError, submitted }`.
         */
        rowLocal: Object.create(null),
        /**
         * 🔴 The bucket boundary, captured ONCE. 014 §2.1 / §7.1 Q2 / 007 GAP-6: NO countdown,
         * NO live timer, ever. Every re-render (download, mark-submitted) reuses this instant,
         * so a row can never migrate buckets while the operator is looking at it.
         */
        renderNow: 0,
        /** Transient status-line note, e.g. `sheet downloaded ✓`. */
        statusNote: null,

        // ── T3-08 addition ──────────────────────────────────────────────────────────────
        /**
         * The filing_id whose ⇥ insert is currently in flight, or null. ONE insert at a time
         * for the whole window (main.js additionally rejects a second insert on the same
         * portal pane): the flow ends in a read-back verdict about ONE file in ONE input, and
         * two overlapping flows would race each other's verdicts.
         */
        insertBusy: null,

        // ── T3-03 addition ──────────────────────────────────────────────────────────────
        /**
         * The deep link's `focus_filing_id`, kept ONLY when that filing is actually in this
         * payload's worklist (a stale id from the web renders nothing rather than lying).
         * Read by `renderRow` for the highlight; the boot block at the bottom of the file
         * does the one-time villa auto-select. Never changes after boot.
         */
        focusFilingId: null,

        // ── A-WEB-4e addition ───────────────────────────────────────────────────────────
        /**
         * The portal slot of the status line: `waiting for captcha…` → `credentials filled ✓`
         * (mockup H8). `{ text, cls }` or null. Belongs to the ACTIVE villa and is cleared the
         * moment the selection moves, so it can never describe the wrong villa's portal.
         */
        portalStatus: null,
      };

      var listeners = [];

      var el = {
        list: document.getElementById('list'),
        count: document.getElementById('count'),
        statusline: document.getElementById('statusline'),
        viewport: document.getElementById('viewport'),
        portalMsg: document.getElementById('portal-msg'),
        insertBanner: document.getElementById('insert-banner'),
        urlbox: document.getElementById('urlbox'),
        loadingBar: document.getElementById('loading-bar'),
        back: document.getElementById('btn-back'),
        fwd: document.getElementById('btn-fwd'),
        reload: document.getElementById('btn-reload'),
        sessionBar: document.getElementById('sessionbar'),
        sbVilla: document.getElementById('sb-villa'),
        sbAcct: document.getElementById('sb-acct'),
        sbPill: document.getElementById('sb-pill'),
        sbFresh: document.getElementById('sb-fresh'),
      };

      // ── selection plumbing ─────────────────────────────────────────────────────────────
      // Clicking a row makes its VILLA active. The villa — not the row — is the unit, because
      // the villa is the portal-session boundary (014 §7.2). 4e subscribes via
      // `onActiveVillaChange` and autofills that villa's account; 4c fires the event and moves
      // the highlight, and does nothing to the portal.

      /** The account for a villa, or null. Absent credentials is normal, not an error. */
      function accountFor(villa) {
        for (var i = 0; i < state.worklist.length; i += 1) {
          if (state.worklist[i].villa === villa && state.worklist[i].account) {
            return state.worklist[i].account;
          }
        }
        return null;
      }

      /**
       * 🔴 A-WEB-4e — THE DEFINITION OF "LOCKED", and the one line that keeps it from becoming
       * 4d's dead worklist.
       *
       * Locked = this villa HAS credentials but no session yet. A CRED-LESS villa is **never**
       * locked: it is `manual login` (014 §7.9 — the NORMAL launch state), the human types the
       * password themselves, and the Helper has no way to observe that. Gating anything on a
       * session a cred-less villa can never acquire would kill the exact rows that ship first.
       *
       * This matches `renderSessionBar`'s class precedence exactly — `no-acct` BEFORE `locked` —
       * so the session bar and the row affordances can never disagree.
       */
      function isLocked(villa) {
        return !!accountFor(villa) && !state.villaSession[villa];
      }

      /**
       * Q2 — paint the active villa's portal session into the portal pane.
       *
       * The three-way state and its precedence are the villa group header's, unchanged:
       * `no-acct` BEFORE `locked`, because a cred-less villa is never locked — it is a MANUAL
       * login, the normal launch state, and the Helper cannot observe when the human finishes
       * it. Keeping the precedence identical is what stops the bar and `isLocked` — which still
       * gates the row's primary action — from ever disagreeing.
       *
       * No villa selected → the bar is hidden outright rather than emptied: an unselected pane
       * has no session to describe, and a blank bar would imply it had one.
       */
      function renderSessionBar() {
        var villa = state.activeVilla;
        if (!villa) {
          el.sessionBar.classList.add('hidden');
          return;
        }
        el.sessionBar.classList.remove('hidden');

        var account = accountFor(villa);
        var session = state.villaSession[villa] || null;

        el.sessionBar.classList.toggle('no-acct', !account);
        el.sessionBar.classList.toggle('open-session', !!account && !!session);

        el.sbVilla.textContent = villa; // one name, never split (009 §10)

        if (account) {
          el.sbAcct.className = 'sb-acct';
          el.sbAcct.textContent = account.login;
        } else {
          // Calm and first-class: on day one this is most villas, not a fault (014 §7.9).
          el.sbAcct.className = 'sb-acct none';
          el.sbAcct.textContent = 'no portal credentials yet';
        }

        if (!account) {
          el.sbPill.className = 'sb-pill manual';
          setLabel(el.sbPill, null, 'manual login');
        } else if (session) {
          el.sbPill.className = 'sb-pill open';
          setLabel(el.sbPill, 'check', 'session open');
        } else {
          el.sbPill.className = 'sb-pill locked';
          setLabel(el.sbPill, 'lock', 'log in');
        }

        setLabel(el.sbFresh, 'refresh', 'Fresh login');
        el.sbFresh.title = account
          ? "Clear this villa's portal session and start the login over"
          : "Clear this villa's portal session and start the manual login over";
      }

      function setActiveVilla(villa) {
        if (state.activeVilla === villa) return;
        state.activeVilla = villa;

        var rows = el.list.querySelectorAll('[data-villa]');
        for (var i = 0; i < rows.length; i += 1) {
          rows[i].classList.toggle('sel', rows[i].getAttribute('data-villa') === villa);
        }

        // T3-08: ⇥ insert is gated on the ACTIVE villa, so its buttons follow the selection —
        // the same lightweight in-place update the `.sel` toggle above is, not a re-render.
        syncAllInsertButtons();

        renderStatusLine();
        renderSessionBar(); // Q2: the pane's session follows the selection that owns it
        document.title = villa ? 'TM30 Helper — ' + villa : 'TM30 Helper';

        var account = villa ? accountFor(villa) : null;
        for (var j = 0; j < listeners.length; j += 1) {
          try {
            listeners[j]({ villa: villa, account: account, session: state.villaSession[villa] || null });
          } catch (err) {
            console.error('[tm30-helper] an active-villa listener threw', err);
          }
        }
      }

      /** 4e/4f attach here. Returns an unsubscribe. */
      function onActiveVillaChange(fn) {
        listeners.push(fn);
        return function () {
          var i = listeners.indexOf(fn);
          if (i >= 0) listeners.splice(i, 1);
        };
      }

      // ═══════════════════════════════════════════════════════════════════════════════════
      // A-WEB-4d — THE FILING WORKLIST PANE (014 §7.2, §3; mockup H2 + H4)
      //
      // This replaces 4c's placeholder flat list. Structure, top to bottom:
      //
      //   [ ▶ postponed (24h+) · N villas · M filings ]   ← collapsed by default, hidden if empty
      //   ── within 24h ──────────────────────────────
      //   [ villa group ] rows…                          ← most-urgent group first
      //   [ villa group ] rows…
      //   [ villa group ] rows…                          ← AMB-5: finished groups sink here
      //
      // What it deliberately does NOT do:
      //   · 4e — autofill. Nothing here calls `webview.executeJavaScript`. The group's session
      //     pill reads `state.villaSession`, which ONLY 4e ever writes.
      //   · record a submission. 4f's `✓ Mark as submitted` opens `return_url` in the operator's
      //     REAL browser and stops there; the web tab records it (005 §8.4).
      // ═══════════════════════════════════════════════════════════════════════════════════

      var POSTPONED_AFTER_MS = 24 * 60 * 60 * 1000;
      var DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      var MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                         'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

      /**
       * The six row states, and the mockup H2 art each one wears. `label` is the badge text.
       *
       * 🔴 This is a RENDERING of server fields, not a state machine. `overdue` comes from
       * `row.dot`, which the server computed; `downloaded` is Helper-local and never leaves the
       * process (mockup H2 GAP-B). Nothing here re-derives urgency.
       */
      /**
       * Icons, inline.
       *
       * The pane used emoji — 🔒 ⇥ ⬇ 📁 ↻ ✓ ▶ — whose weight, size and colour come from
       * whichever emoji font the OS supplies, so a control rendered heavier on a Mac than on
       * Windows and none of them could take their button's colour. These are lucide paths on
       * the same 24px grid the web app uses, drawn in `currentColor`. This file ships with no
       * dependencies, so they are strings.
       */
      var ICON_PATHS = {
        check: '<polyline points="20 6 9 17 4 12"/>',
        download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
        insert: '<polyline points="3 12 11 12"/><polyline points="8 8 12 12 8 16"/><line x1="18" y1="4" x2="18" y2="20"/>',
        folder: '<path d="M4 20a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2z"/>',
        refresh: '<polyline points="1 4 1 10 7 10"/><path d="M3.5 15a9 9 0 1 0 2.1-9.4L1 10"/>',
        lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
        chevron: '<polyline points="9 18 15 12 9 6"/>',
        external: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>',
      };

      /** An `<svg>` string for one icon, sized in px and inheriting the caller's colour. */
      function icon(name, size) {
        return (
          '<svg width="' + (size || 13) + '" height="' + (size || 13) + '" viewBox="0 0 24 24" ' +
          'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
          'stroke-linejoin="round" aria-hidden="true">' + ICON_PATHS[name] + '</svg>'
        );
      }

      /** A button's label: icon + text, both inheriting the button's colour. */
      function setLabel(btn, name, text) {
        btn.innerHTML = name ? icon(name) : '';
        if (text) btn.appendChild(document.createTextNode(text));
      }

      var STATE_ART = {
        need:       { row: 's-need',  badge: 'b-need',  label: 'need upload' },
        downloaded: { row: 's-dl',    badge: 'b-dl',    label: 'downloaded' },
        awaiting:   { row: 's-await', badge: 'b-await', label: 'awaiting approval' },
        approved:   { row: 's-sub',   badge: 'b-sub',   label: 'approved' },
        overdue:    { row: 's-over',  badge: 'b-over',  label: 'overdue' },
        nosheet:    { row: 's-block', badge: 'b-block', label: 'no sheet yet' },
      };

      /**
       * Where a filing stands in the queue. Lower sorts first.
       *
       * This replaces grouping by villa. Grouping answered "whose portal session covers this?"
       * — a question about the TOOL — and to answer it, it reordered the operator's work: a
       * villa with one relaxed filing could sit above another villa's overdue one, because the
       * villa, not the deadline, decided the position. Flat and ranked, the top of the list is
       * simply what to do next. The session is still per-villa; it just stopped choosing the
       * order.
       */
      function priorityRank(row) {
        var kind = rowState(row);
        if (isFinishedState(kind)) return 4;      // nothing left to do — sinks to the bottom
        if (row.dot === 'overdue') return 0;
        if (row.dot === 'due' && isToday(row.checkin)) return 1;
        if (!isPostponed(row)) return 2;          // inside the 24h window
        return 3;                                 // later
      }

      /** The worklist in the order it should be worked: rank first, then soonest check-in. */
      function byPriority(rows) {
        return rows.slice().sort(function (a, b) {
          var d = priorityRank(a) - priorityRank(b);
          if (d !== 0) return d;
          var ta = checkinDayMs(a.checkin);
          var tb = checkinDayMs(b.checkin);
          if (ta !== tb) return (ta === null ? Infinity : ta) - (tb === null ? Infinity : tb);
          return String(a.villa).localeCompare(String(b.villa));
        });
      }

      /** A group whose every row is in one of these has nothing left to do → AMB-5 sink. */
      function isFinishedState(s) { return s === 'awaiting' || s === 'approved'; }

      /**
       * The check-in as UTC midnight of its DAY.
       *
       * 🔴 Day precision, deliberately (A-BE-5 finding #2: the source column is `DATEONLY`
       * unless a check-in-event override exists; the 4a′ redraw dropped `· 12:00 ·` for exactly
       * this reason). Parsed off the ISO STRING rather than through `new Date()` so the local
       * timezone cannot shift a check-in onto the wrong day — the bug that would silently
       * mis-bucket every filing for anyone west of UTC.
       *
       * @returns {number|null} epoch ms, or null when `checkin` is unusable.
       */
      function checkinDayMs(checkin) {
        var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(checkin || ''));
        if (!m) return null;
        return Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      }

      /** `Fri 18 Jul` — the whole label the mockup draws. No clock (014 §2.1). */
      function formatCheckinDay(checkin) {
        var ms = checkinDayMs(checkin);
        if (ms === null) return '—';
        var d = new Date(ms);
        return DAY_NAMES[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MONTH_NAMES[d.getUTCMonth()];
      }

      /**
       * Is this check-in the CURRENT day? Compared in UTC on both sides, because the check-in
       * is a UTC-midnight `DATEONLY` (A-BE-5 finding #2) — mixing a UTC date against a local
       * one is how a row lands on the wrong day either side of midnight. Uses the same
       * captured `state.renderNow`, so it is a snapshot like everything else here, not a clock.
       */
      function isToday(checkin) {
        var ms = checkinDayMs(checkin);
        if (ms === null) return false;
        var now = new Date(state.renderNow);
        return ms === Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
      }

      /**
       * Whether a row sits beyond the 24h horizon. **Per ROW, not per villa** — AMB-1
       * (2026-07-20): a villa's postponed filing is never promoted just because a sibling is
       * urgent. Now that the list is flat this feeds `priorityRank` rather than choosing a
       * container, but the per-row rule is the same one and must stay per-row.
       *
       * The boundary is the check-in (014 §7.1 Q2), measured against `state.renderNow` — an
       * instant captured ONCE, never a ticking clock.
       */
      function isPostponed(row) {
        var ms = checkinDayMs(row.checkin);
        if (ms === null) return false; // unusable check-in → keep it in front of the operator
        return ms > state.renderNow + POSTPONED_AFTER_MS;
      }

      /**
       * The row's display state. Precedence runs finished → blocked → local → urgency.
       *
       * 🔴 `row.dot` is READ, never computed. 014 §7.3 defect 3 / `Tm30CollectionItem`: "MUST
       * equal getTm30DotState — never recomputed client-side". The `when` line below shows the
       * dot's urgency independently, so a row never loses its Due/Overdue signal to this
       * precedence order.
       */
      function rowState(row) {
        var local = state.rowLocal[row.filing_id];
        if (row.status === 'acknowledged') return 'approved';
        if (row.status === 'submitted' || (local && local.submitted)) return 'awaiting';
        if (!row.sheet_download_url) return 'nosheet';
        if (local && local.downloadPath) return 'downloaded';
        if (row.dot === 'overdue') return 'overdue';
        return 'need';
      }


      // ── row actions ────────────────────────────────────────────────────────────────────

      /**
       * ⇥ insert — T3-08, THE END OF THE MANUAL FILE PICK.
       *
       * The ⬇ button above still ends with a human choosing a file in the portal's picker —
       * and a picker showing "name.xlsx" next to "name (1).xlsx" is exactly where the wrong
       * villa's guests get filed. This verb closes that hole: the file identity is derived
       * from the ROW (filing_id → sheet_download_url), main.js downloads it to a path only
       * this filing owns ({userData}/tm30-sheets/{filing_id}/), places it straight into the
       * portal page's file input (CDP primary / in-page fallback) and READS IT BACK before
       * claiming anything. No picker ever opens; no human file choice exists in the path.
       *
       * ── Portal NO-GO (010 §8) status of this verb ──────────────────────────────────────
       * The ONE DOM write is the file input's `.files` — the same "help the human's own
       * session" class as 4e's login fields. NOTHING is clicked and NOTHING navigates:
       * pressing the portal's submit stays the manager's own decision, in the portal pane.
       *
       * ── Why it is gated on the ACTIVE villa ────────────────────────────────────────────
       * The insert lands in the pane the operator is LOOKING AT. Inserting into a background
       * villa's pane would be an invisible mutation of a page mid-flow — so rows of every
       * other villa keep the button disabled with the reason on hover (`syncInsertButton`),
       * and main.js only ever targets the webview of the partition the ROW derives. Until the
       * lock endpoint lands, this row-identity gate is the whole gating (T3-08 scope ruling).
       */
      function insertSheet(row, btn, opts) {
        // `btn` is null on the T3-11 AUTO path (there was no click); `opts.auto` marks it, and is
        // the ONLY behavioural delta — a successful auto-insert also raises the top-of-pane banner
        // so the human sees a placement they did not make by hand. Everything else (the download,
        // the engine, the read-back verdict, the status line, the row) is byte-identical to the
        // manual ⇥, because auto calls this SAME flow. (T3-08 contract 6: manual ⇥ unchanged.)
        opts = opts || {};
        if (!row.sheet_download_url) return;
        if (!window.tm30Native || !window.tm30Native.insertSheet) {
          console.error('[tm30-helper] tm30Native.insertSheet is missing — preload did not load');
          setStatusNote('insert unavailable — the native bridge did not load', 'st-none');
          return;
        }
        // Belt only — `syncInsertButton` already disables both cases below.
        if (row.villa !== state.activeVilla || state.insertBusy !== null) return;

        state.insertBusy = row.filing_id;
        syncAllInsertButtons();
        if (btn) setLabel(btn, 'insert', 'inserting sheet…');
        setStatusNote('inserting the sheet into the portal…', 'st-none');

        window.tm30Native.insertSheet({
          filing_id: row.filing_id,
          url: row.sheet_download_url,
          partition: partitionFor(row.villa),
        }).then(function (res) {
          state.insertBusy = null;
          var local = (state.rowLocal[row.filing_id] = state.rowLocal[row.filing_id] || {});

          if (res && res.ok) {
            local.insert = res;
            local.insertError = null;
            // The sheet IS on disk now (the per-task copy) — the row honestly says so too.
            local.downloadPath = res.path;
            local.downloadError = null;
            var mech = res.mechanism === 'inpage' ? ' (in-page fallback)' : '';
            if (res.verification === 'accepted') {
              /**
               * Stage-2 SOFT success: a CONSUMING uploader (the real portal) read the file into
               * its own state and cleared the input, so the byte read-back could not confirm it —
               * but the filename IS on the page, so the insert WORKED. This is a ✓, never a
               * mismatch: we just can't verify the bytes, so we point the human at the page's own
               * preview before they save.
               */
              setStatusNote(
                'inserted ✓ ' + res.filename + mech +
                  ' — accepted by the page (input consumed); check the page preview before saving',
                'st-ok'
              );
            } else {
              setStatusNote(
                'inserted ✓ ' + res.filename + mech +
                  ' — check the portal pane and submit there yourself',
                'st-ok'
              );
            }
            // T3-11: only the AUTO path raises the banner — a manual ⇥ was a click the operator
            // already watched, so its behaviour stays exactly as T3-08 shipped it (contract 6).
            if (opts.auto) showInsertBanner(row.villa, res.filename);
          } else {
            local.insert = null;
            /**
             * 🔴 Failure honesty (014 §7.9 + T3-08 contract 6): every stage fails with ITS
             * OWN words, and the verification stage adds the one instruction that matters —
             * do NOT submit. Falling back to "the manager picks by hand" happens only out
             * loud, in this message, never silently.
             */
            var why = (res && res.error) || 'unknown error';
            if (res && res.stage === 'verify') {
              local.insertError =
                'verification MISMATCH — do NOT submit: ' + why +
                '. Retry the insert, or upload by hand via ⬇ xlsx.';
              setStatusNote('insert FAILED verification — do NOT submit · ' + why, 'st-none');
            } else {
              local.insertError = why;
              setStatusNote('insert failed — ' + why, 'st-none');
            }
          }
          renderList();
        });
      }

      /**
       * One ⇥ button's disabled state + hover reason, from the current shell state. Called at
       * render time AND by `setActiveVilla`/`insertSheet` in place — the button must follow
       * the selection without a full re-render (the row's other slots never move).
       */
      function syncInsertButton(btn) {
        var villa = btn.getAttribute('data-villa');
        if (btn.getAttribute('data-has-sheet') !== '1') {
          btn.disabled = true;
          btn.title = 'The sheet is generated from D-2 — nothing to insert yet.';
        } else if (state.insertBusy !== null) {
          btn.disabled = true;

      /**
       * Can this row's hand-back actually go anywhere?

       * `return_url` is built WEB-side by the 4b emitter from `booking_id` (014 §7.3 defect 2 —
       * routing is the web's business), and `deeplink.js` only copies it across when it is a
       * string. A row can therefore arrive without one — from an older link, or a payload built

       * lives; the webview holds a Thai-immigration session and knows nothing about our cookies.

       * receipt number, and calls endpoint #9 with the user who is actually signed in.

       * no network (014 §2.5 — it could not authenticate the attestation even if it wanted to),

       * identified. Iteration 2 (005 §8.4) revisits this with a short-lived token; not now.

       * invisible from here. So the flag is DISPLAY-ONLY (`local`, never persisted, never sent),

       * status arrives the only way it can: the next worklist regenerated from the web.

        if (row.dot === 'due' && isToday(row.checkin)) {

        box.appendChild(when);

        var statusBtn = document.createElement('button');
        statusBtn.type = 'button';

          setLabel(statusBtn, 'external', 'Reopen confirm');

        var insertBtn = document.createElement('button');

        insertBtn.className = 'btn act-insert';
        setLabel(insertBtn, 'insert', state.insertBusy === row.filing_id ? 'inserting sheet…' : 'insert sheet');

          so the button was a third road to a file the other two already deliver.

          `downloadSheet()` went with it: nothing called it once the button was gone, and it
          was NOT shared with `insertSheet`, which goes through `tm30Native.insertSheet`. The
          native `tm30Native.downloadSheet` bridge is left in place — it is main-process

        var folderBtn = document.createElement('button');

        // ── the explanatory line, when the state has something to say ──

        if (local.handbackError) msg = 'hand-back failed — ' + local.handbackError;
        else if (kind !== 'approved' && row.status !== 'submitted' && !canHandBack(row))

        else if (local.downloadError) msg = 'download failed — ' + local.downloadError;
        else if (local.submitted && row.status !== 'submitted')
          /**

           * that, so it must not read like `✓ Submitted` — the server's own word, which arrives
           * only with the next worklist.

          msg = 'Marked here after opening the web confirm — the Helper cannot see whether it ' +
                'was recorded. The real status comes back with the next worklist.';
        else if (local.insert)

                ' — submission stays yours, in the portal pane.';
        else if (local.downloadPath) msg = 'sheet downloaded ✓ · ' + local.downloadPath;
        else if (kind === 'nosheet') msg = 'Sheet is generated from D-2 — nothing to upload yet.';

      }


      /**
       * 🔴 THE 4d SEAM (replaces 4c's placeholder). Everything the shell relies on is kept:
       * every clickable element carries `data-villa`, and clicking calls `setActiveVilla`.
       * `state.villaSession` is NOT re-keyed per group — it stays villa-keyed (AMB-1).
       */
      function renderList() {
        // The instant is captured ONCE, on the first render, and reused by every re-render.
        // A row must never change bucket because the operator took a minute to read it.
        if (!state.renderNow) state.renderNow = Date.now();

        el.list.textContent = '';

        if (!state.worklist.length) {
          var empty = document.createElement('div');
          empty.className = 'empty';

            '<div style="font-size:26px">✓</div>' +
            '<div class="big">Nothing to file today</div>' +

            'Re-open from the web to refresh this list.</div>';

          grouping by villa, and a collapsed "postponed (24h+)" bucket — both reordered the
          queue around something other than urgency: the villa that owned a filing, or the
          side of a 24h line it fell on. An overdue filing could sit below a relaxed one
          because its villa sorted later, or be two clicks away inside a folded group.

          The 24h boundary survives as a RANK (`priorityRank`), not as a container: later
          filings sink to the bottom, where they stop competing for attention without being
          hidden from it.

        var ordered = byPriority(state.worklist);

        });

       * to be built from. With the list flat the operator's question is "how much is on me,
       * and how much of it is late", so that is what it answers.
       */
      function renderCount() {

        var open = rows.filter(function (r) { return !isFinishedState(rowState(r)); });

      // ── status line (mockup H8) ────────────────────────────────────────────────────────

      // 4e appends the captcha-wait / ✓ credentials filled states; 4c owns the account slot only.
      function renderStatusLine() {
        el.statusline.textContent = '';

        function add(text, cls) {

          if (cls) s.className = cls;
          s.textContent = text;
          el.statusline.appendChild(s);
          return s;
        }

        if (!state.activeVilla) {
          add(state.worklist.length ? 'Select a villa to start' : 'Nothing to file', 'st-none');
        } else {
          add(state.activeVilla, 'st-acct');
          sep();

          var account = accountFor(state.activeVilla);
          if (account) {
            add(account.login);

            add('no credentials — log in manually', 'st-none');

           * 4e's portal slot (mockup H8): `waiting for captcha…` → `credentials filled ✓`.
           * These are the 4a′ English translations of v1's `ждём капчу…` / `✓ подставлено`
           * (`window.html:123,204`) — same two states, same order, same meaning.
           *
           * A cred-less villa leaves this slot EMPTY on purpose: the account slot directly to
           * its left already reads `no credentials — log in manually`, and saying it twice in
           * one line reads like a warning about a state that is simply normal (014 §7.9).
           */
          if (state.portalStatus) {
            sep();
            add(state.portalStatus.text, state.portalStatus.cls);

        }

        // 4d: the download's own line — `sheet downloaded ✓` (4a′ PO ruling: English).
        // Pushed right so it never fights the account slot 4c owns, or 4e's captcha-wait.
        if (state.statusNote) {
          add('', 'spacer');
          add(state.statusNote.text, state.statusNote.cls || 'st-ok');
        }
